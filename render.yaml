# Deploy: New → Blueprint → paste this repo. Creates one WebSocket-capable Node service.
# After deploy, open neural-heist.html locally or host it anywhere, then use terminal
# "DEDICATED SERVER (WSS)" with wss://<this-service>.onrender.com/ws
# Or append: ?ws=wss%3A%2F%2F<host>%2Fws&slots=2
services:
  - type: web
    name: neural-heist-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NH_MISSION_ID
        value: "1"
      - key: NH_SLOT_COUNT
        value: "2"
      - key: NH_TICK_HZ
        value: "20"
