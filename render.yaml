# Node version: https://render.com/docs/node-version
# (NODE_VERSION env below overrides; .node-version also pins the repo.)
# Deploy: New → Blueprint → paste this repo. Creates one WebSocket-capable Node service.
# After deploy, open index.html locally or host it anywhere, then use terminal
# "DEDICATED SERVER (WSS)" with wss://neural-heist.onrender.com/ws (path must be /ws)
# Or append: ?ws=wss%3A%2F%2F<host>%2Fws&slots=2
services:
  - type: web
    name: neural-heist-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NH_MISSION_ID
        value: "1"
      # Max mission index allowed if clients send missionId in HELLO (default 6).
      - key: NH_MAX_MISSION
        value: "6"
      - key: NH_SLOT_COUNT
        value: "2"
      - key: NH_TICK_HZ
        value: "20"
