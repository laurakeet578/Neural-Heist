<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Heist: Undercover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030508; font-family: "Segoe UI", system-ui, sans-serif; }
    #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; user-select: none; cursor: crosshair; }
    canvas.hack-cursor { cursor: pointer; }
    #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: rgba(0,255,220,0.5); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; pointer-events: none; }
    #breachBtn { position: absolute; bottom: 36px; right: 12px; z-index: 2; padding: 8px 14px; font: 11px ui-monospace, monospace; letter-spacing: 0.06em; color: #00ffee; background: rgba(6,14,22,0.94); border: 1px solid rgba(0,255,220,0.4); border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(window.location.search);
        var s = q.get("slots");
        if (s != null && s !== "") window.NEURAL_HEIST_SLOTS = Math.max(2, Math.min(4, parseInt(s, 10) || 2));
      } catch (e) {}
    })();
  </script>
  <div id="wrap">
    <canvas id="c" width="1280" height="720" tabindex="0"></canvas>
    <button type="button" id="breachBtn">Interact [E]</button>
    <p id="hint"></p>
  </div>
<script>
/**
 * NEURAL HEIST: UNDERCOVER — Client–host separation with wire protocol.
 * - Embedded host (campaign): SimulationRunner ticks in-process.
 * - Multiplayer: always uses NH_DEDICATED_WS_URL (Node + ws); client sends INPUT, applies SNAPSHOT only.
 */
(function () {
  "use strict";
  const VIEW_W = 1280, VIEW_H = 720;
  /** Authoritative Node host for online co-op. Edit if your game server moves. */
  const NH_DEDICATED_WS_URL = (() => {
    if (typeof window === "undefined" || !window.location) return "wss://neural-heist.onrender.com/ws";
    const h = String(window.location.hostname || "").toLowerCase();
    if (h === "localhost" || h === "127.0.0.1") return "ws://127.0.0.1:8787/ws";
    return "wss://neural-heist.onrender.com/ws";
  })();
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const lerp = (a,b,t) => a + (b-a)*t;
  const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const distSq = (ax,ay,bx,by) => { const dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; };

  const LS_KEY = "neuralHeist_undercover_v1";
  function loadUnlock() {
    const raw = parseInt(localStorage.getItem(LS_KEY) || "1", 10);
    return Number.isFinite(raw) ? clamp(raw, 1, 3) : 1;
  }
  function saveUnlock(m) { localStorage.setItem(LS_KEY, String(Math.max(loadUnlock(), m))); }

  function pointInRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
  function pointInsideAnyWall(px, py, walls) {
    if (!walls) return false;
    for (let i = 0; i < walls.length; i++) if (pointInRect(px, py, walls[i])) return true;
    return false;
  }
  const DEFAULT_MIN_MISSION_SEC = 0;
  const DEFAULT_MIN_DWELL_SEC = 0;
  const CAM_ALARM_PER_SEC = 22;
  const ALARM_DECAY_PER_SEC = 2.8;
  const RED_ALERT_ALARM_ENTER = 82;
  const RED_ALERT_COUNTDOWN_SEC = 48;
  const HIDDEN_DECAY_DELAY_SEC = 1.25;
  const EXPOSURE_FAIL_THRESHOLD = 99.25;
  const EXPOSURE_FAIL_HOLD_SEC = 1.15;
  const SOCIAL_REPORT_COOLDOWN_MS = 6200;
  const SOCIAL_REPORT_MIN_SUSPICION = 58;
  const SOCIAL_FOLLOW_SUSPICION = 64;

  /** Presentation-only: shake, HUD smoothing, menu time — does not affect simulation. */
  const VisualJuice = {
    shake: 0,
    alertFlash: 0,
    exposurePulse: 0,
    hudRiskSmooth: 0,
    lastAlertLen: 0,
    uiT: 0,
    bumpShake(amt) { this.shake = Math.min(22, this.shake + amt); },
    updatePresentation(dt, gsm) {
      this.uiT += dt;
      this.shake *= Math.pow(0.86, dt * 60);
      this.alertFlash = Math.max(0, this.alertFlash - dt * 2.5);
      if (!gsm.world || gsm.phase !== "playing") {
        this.exposurePulse = Math.max(0, this.exposurePulse - dt * 1.5);
        return;
      }
      const w = gsm.world;
      const exp = (w.exposure != null) ? w.exposure : 0;
      const risk = exp;
      this.hudRiskSmooth = lerp(this.hudRiskSmooth, risk, 1 - Math.exp(-dt * 10));
      const rumble = (w.alarm / 100) * 1.7 + (exp / 100) * 1.5;
      this.shake = lerp(this.shake, rumble, 1 - Math.exp(-dt * 5));
      if (NetworkManager.alerts.length > this.lastAlertLen) {
        this.bumpShake(5.5);
        this.alertFlash = 1;
      }
      this.lastAlertLen = NetworkManager.alerts.length;
      this.exposurePulse = exp > 78 ? Math.min(1, this.exposurePulse + dt * 2.2) : Math.max(0, this.exposurePulse - dt * 1.8);
    },
    screenOffset() {
      const t = this.uiT;
      const s = this.shake * (0.35 + this.alertFlash * 0.65);
      return {
        x: s * (Math.sin(t * 47) * 0.55 + Math.sin(t * 29) * 0.45),
        y: s * (Math.cos(t * 41) * 0.55 + Math.cos(t * 33) * 0.45)
      };
    }
  };

  const PLAYER_SKINS = [
    { circuit: "#00f0ff", visor: "#00ffff" },
    { circuit: "#ff55cc", visor: "#ffaaff" },
    { circuit: "#66ff44", visor: "#ccff99" },
    { circuit: "#ffaa33", visor: "#ffdd88" }
  ];
  const ROLE_TABLE_4P = ["saboteur", "security_agent", "technician", "civilian"];

  /**
   * Wire protocol v1 — mirror in Node (`ws`):
   * - Host loop: apply INPUT per slot → SimulationRunner-equivalent tick → broadcast SNAPSHOT @ 20–60 Hz.
   * - On HELLO, assign slot, reply WELCOME { slot }, seed, mission id.
   * - ACTION: dispatch to same handlers as GameStateManager.try* (authoritative).
   * - Presence: track sockets per slot; set connectedSlots[i]=false on leave; include in SNAPSHOT.
   */
  const Net = {
    PROTOCOL_VERSION: 1,
    Msg: {
      HELLO: "hello",
      WELCOME: "welcome",
      INPUT: "input",
      SNAPSHOT: "snapshot",
      ACTION: "action",
      PLAYER_JOINED: "player_joined",
      PLAYER_LEFT: "player_left",
      MISSION: "mission",
      PING: "ping",
      PONG: "pong",
      ERROR: "error",
      ROOM_CREATE: "room_create",
      ROOM_JOIN: "room_join",
      ROOM_JOIN_RESULT: "room_join_result",
      START_MATCH: "start_match",
      GAME_START: "game_start",
      CUTSCENE_SKIP_REQUEST: "cutscene_skip_request",
      CUTSCENE_SKIPPED: "cutscene_skipped",
      SNAPSHOT_ACK: "snapshot_ack"
    }
  };

  /** Per-terminal interaction lifecycle (synced via snapshot `terminalStates`). */
  const TerminalState = {
    INACTIVE: "inactive",
    IN_PROGRESS: "in_progress",
    COMPLETED: "completed",
    ensure(t) {
      if (t && (t.state == null || t.state === "")) t.state = TerminalState.INACTIVE;
    },
    set(t, s) {
      if (t) t.state = s;
    },
    isCompleted(t) {
      if (!t) return false;
      TerminalState.ensure(t);
      return t.state === TerminalState.COMPLETED;
    },
    isInProgress(t) {
      if (!t) return false;
      TerminalState.ensure(t);
      return t.state === TerminalState.IN_PROGRESS;
    },
    /** Rebuild states from progress fields when snapshot has no terminalStates (older hosts). */
    applyProgressDerivedStates(world) {
      const w = world;
      if (!w || !w.terminals) return;
      const h = w.hackedTerminals || {};
      for (let i = 0; i < w.terminals.length; i++) {
        const t = w.terminals[i];
        TerminalState.ensure(t);
        if (t.state === TerminalState.IN_PROGRESS) continue;
        if (t.kind === "primary" && h[t.id]) t.state = TerminalState.COMPLETED;
        else if (t.kind === "cameras" && w.camerasDisabled) t.state = TerminalState.COMPLETED;
        else if (t.kind === "bonus_data" && w.flags && w.flags.bonusDataDownloaded) t.state = TerminalState.COMPLETED;
        else if (t.kind === "door" && t.doorId && w.doorsOpen && w.doorsOpen[t.doorId]) t.state = TerminalState.COMPLETED;
      }
    }
  };

  const MULTI_MIN_SLOTS = 2;
  const MULTI_MAX_SLOTS = 4;
  const STATES = { MENU: 0, CAMPAIGN: 1, MULTIPLAYER_LOBBY: 2, HACKING: 3, GAMEOVER: 4 };
  let gameState = "MENU";
  let activeHackingSession = null;

  const NetProtocol = {
    /** Full authoritative snapshot for late join + frame sync (guards + world + players). */
    buildSnapshotV1(world, players, tick, connectedSlots) {
      const guards = (world.guards || []).map((g, i) => ({
        i,
        x: g.x,
        y: g.y,
        facing: g.facing,
        aiState: g.aiState,
        behavior: g.aiState,
        animT: g.animT,
        headYaw: g.headYaw,
        wpIndex: g.wpIndex,
        searchTimer: g.searchTimer,
        investigatePoint: g.investigatePoint,
        lastKnown: g.lastKnown,
        elite: !!g.elite
      }));
      const cams = (world.cameras || []).map((c, i) => ({ i, x: c.x, y: c.y, angle: c.angle, active: c.active }));
      return {
        v: Net.PROTOCOL_VERSION,
        type: Net.Msg.SNAPSHOT,
        tick,
        missionElapsed: world.missionElapsed || 0,
        exposure: world.exposure != null ? world.exposure : 0,
        securityLevel: world.securityLevel != null ? world.securityLevel : (world.exposure || 0),
        alarm: world.alarm,
        alerts: NetworkManager.alerts ? NetworkManager.alerts.slice(-8) : [],
        primaryDone: !!world.primaryDone,
        primaryProgress: world.primaryProgress || 0,
        primaryRequired: world.primaryRequired || 1,
        hackedTerminals: world.hackedTerminals ? Object.assign({}, world.hackedTerminals) : {},
        camerasDisabled: !!world.camerasDisabled,
        objectives: (world.objectives || []).map(o => ({ slot: o.slot, type: o.type, done: !!o.done })),
        doorsOpen: world.doorsOpen ? Object.assign({}, world.doorsOpen) : {},
        terminalStates: (() => {
          const ts = {};
          for (let i = 0; i < (world.terminals || []).length; i++) {
            const t = world.terminals[i];
            TerminalState.ensure(t);
            ts[t.id] = t.state;
          }
          return ts;
        })(),
        flags: {
          package: !!(world.flags && world.flags.package),
          sabotageCooldown: world.flags ? world.flags.sabotageCooldown : 0,
          redAlertTimer: world.flags ? world.flags.redAlertTimer : null,
          blackoutUntil: world.flags ? world.flags.blackoutUntil : 0,
          cameraJamUntil: world.flags ? world.flags.cameraJamUntil : 0,
          fakeAlarmUntil: world.flags ? world.flags.fakeAlarmUntil : 0,
          guardFocus: world.flags ? world.flags.guardFocus : null,
          dwellComplete: !!(world.flags && world.flags.dwellComplete),
          lockdownStartedAt: world.flags ? (world.flags.lockdownStartedAt || 0) : 0,
          lockdownEndsAt: world.flags ? (world.flags.lockdownEndsAt || 0) : 0,
          lockdownRemainingSec: world.flags ? (world.flags.lockdownRemainingSec || 0) : 0,
          lockdownActive: !!(world.flags && world.flags.lockdownActive),
          lumenSapUntil: world.flags ? (world.flags.lumenSapUntil || 0) : 0,
          terminalSabotageLocks: world.flags && world.flags.terminalSabotageLocks ? Object.assign({}, world.flags.terminalSabotageLocks) : {},
          doorSabotageRevert: world.flags ? world.flags.doorSabotageRevert : null
        },
        connectedSlots: (connectedSlots || []).slice(),
        players: players.map(p => ({
          id: p.id,
          x: p.x,
          y: p.y,
          vx: p.vx,
          vy: p.vy,
          role: p.role,
          suspicion: p.suspicion,
          fakeTaskTimer: p.fakeTaskTimer,
          facing: p.facing
        })),
        guards,
        cameras: cams
      };
    },
    /** Apply server snapshot onto existing world instance (same mission geometry). */
    applySnapshotV1(world, playersById, snap) {
      if (!snap || snap.v !== Net.PROTOCOL_VERSION) return;
      world.missionElapsed = snap.missionElapsed;
      world.alarm = snap.alarm;
      if (Array.isArray(snap.alerts)) NetworkManager.alerts = snap.alerts.slice(-12);
      if (snap.exposure != null) world.exposure = snap.exposure;
      if (snap.securityLevel != null) world.securityLevel = snap.securityLevel;
      world.primaryDone = snap.primaryDone;
      if (snap.primaryProgress != null) world.primaryProgress = snap.primaryProgress;
      if (snap.primaryRequired != null) world.primaryRequired = snap.primaryRequired;
      if (snap.hackedTerminals && world.hackedTerminals) {
        for (const k of Object.keys(world.hackedTerminals)) delete world.hackedTerminals[k];
        for (const k of Object.keys(snap.hackedTerminals)) world.hackedTerminals[k] = !!snap.hackedTerminals[k];
      }
      if (snap.terminalStates && world.terminals) {
        for (let i = 0; i < world.terminals.length; i++) {
          const t = world.terminals[i];
          const st = snap.terminalStates[t.id];
          if (st != null) TerminalState.set(t, st);
          else TerminalState.ensure(t);
        }
      } else if (world.terminals) {
        TerminalState.applyProgressDerivedStates(world);
      }
      world.camerasDisabled = snap.camerasDisabled;
      if (Array.isArray(snap.objectives) && Array.isArray(world.objectives)) {
        for (let oi = 0; oi < world.objectives.length; oi++) {
          if (snap.objectives[oi]) world.objectives[oi].done = !!snap.objectives[oi].done;
        }
      }
      if (snap.doorsOpen && world.doorsOpen) {
        for (const k of Object.keys(snap.doorsOpen)) world.doorsOpen[k] = snap.doorsOpen[k];
      }
      if (Array.isArray(snap.connectedSlots) && snap.connectedSlots.length) {
        const cs = snap.connectedSlots.map(x => !!x);
        if (!NetworkCoordinator.connectedSlots || NetworkCoordinator.connectedSlots.length !== cs.length) {
          NetworkCoordinator.connectedSlots = cs.slice();
        } else {
          for (let ci = 0; ci < cs.length; ci++) NetworkCoordinator.connectedSlots[ci] = cs[ci];
        }
      }
      if (world.flags) {
        const f = snap.flags || {};
        world.flags.package = f.package;
        world.flags.sabotageCooldown = f.sabotageCooldown;
        world.flags.redAlertTimer = f.redAlertTimer;
        world.flags.blackoutUntil = f.blackoutUntil;
        world.flags.cameraJamUntil = f.cameraJamUntil;
        world.flags.fakeAlarmUntil = f.fakeAlarmUntil;
        world.flags.guardFocus = f.guardFocus;
        world.flags.dwellComplete = f.dwellComplete;
        world.flags.lockdownStartedAt = f.lockdownStartedAt || 0;
        world.flags.lockdownEndsAt = f.lockdownEndsAt || 0;
        world.flags.lockdownRemainingSec = f.lockdownRemainingSec || 0;
        world.flags.lockdownActive = !!f.lockdownActive;
        if (f.lumenSapUntil != null) world.flags.lumenSapUntil = f.lumenSapUntil;
        if (f.terminalSabotageLocks) {
          world.flags.terminalSabotageLocks = world.flags.terminalSabotageLocks || {};
          const L = f.terminalSabotageLocks;
          for (const k of Object.keys(world.flags.terminalSabotageLocks)) delete world.flags.terminalSabotageLocks[k];
          for (const k of Object.keys(L)) world.flags.terminalSabotageLocks[k] = L[k];
        }
        if (f.doorSabotageRevert !== undefined) world.flags.doorSabotageRevert = f.doorSabotageRevert;
      }
      const plist = snap.players || [];
      for (let i = 0; i < plist.length; i++) {
        const s = plist[i];
        const p = playersById[s.id];
        if (!p) continue;
        const isLocal = (GameStateManager && (GameStateManager.localPlayerId | 0) === (p.id | 0));
        if (isLocal) {
          // Keep local player server-authoritative, but damp tiny corrections to reduce visible jitter.
          const dx = (s.x - p.x), dy = (s.y - p.y);
          const d2 = dx * dx + dy * dy;
          if (d2 > 64 * 64) {
            p.x = s.x;
            p.y = s.y;
          } else {
            p.x = lerp(p.x, s.x, 0.42);
            p.y = lerp(p.y, s.y, 0.42);
          }
          p.vx = s.vx;
          p.vy = s.vy;
        } else {
          // Remote entities: store server target and let render frame interpolate smoothly.
          p._netTargetX = s.x;
          p._netTargetY = s.y;
          p._netTargetVx = s.vx || 0;
          p._netTargetVy = s.vy || 0;
          p._netSnapAt = performance.now();
          if (p._netSeen !== true) {
            p.x = s.x;
            p.y = s.y;
            p._netSeen = true;
          }
        }
        p.suspicion = s.suspicion;
        p.fakeTaskTimer = s.fakeTaskTimer;
        if (s.role != null) p.role = s.role;
        if (s.facing != null) p.facing = s.facing;
      }
      const G = snap.guards || [];
      for (let gi = 0; gi < G.length; gi++) {
        const sg = G[gi];
        const g = world.guards[sg.i];
        if (!g) continue;
        g.x = sg.x; g.y = sg.y; g.facing = sg.facing;
        g.aiState = sg.aiState || sg.behavior || "patrol";
        g.animT = sg.animT; g.headYaw = sg.headYaw; g.wpIndex = sg.wpIndex;
        g.searchTimer = sg.searchTimer; g.investigatePoint = sg.investigatePoint;
        g.lastKnown = sg.lastKnown != null ? sg.lastKnown : sg.lastSeen;
      }
      const C = snap.cameras || [];
      for (let ci = 0; ci < C.length; ci++) {
        const sc = C[ci];
        const cam = world.cameras[sc.i];
        if (cam) { cam.x = sc.x; cam.y = sc.y; cam.angle = sc.angle; cam.active = sc.active; }
      }
    }
  };

  /** In-process queue (dev / tests). Real server uses WebSocket instead. */
  function MockTransport() {
    this._in = [];
    this._handlers = [];
    this.lastSnapshot = null;
  }
  MockTransport.prototype.emit = function (event, payload) {
    this._in.push({ event, payload, t: performance.now() });
    if (event === "snapshot") this.lastSnapshot = payload;
  };
  MockTransport.prototype.flush = function (handler) {
    while (this._in.length) handler(this._in.shift());
  };

  /**
   * NetworkCoordinator: embedded host runs full SimulationRunner; ws_client only applies snapshots.
   * Single-player and mock multiplayer always use embedded host (no regression).
   */
  const GlobalGameState = {
    rooms: Object.create(null),
    peers: Object.create(null),
    hostByRoom: Object.create(null)
  };
  const PeerManager = {
    uuid() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
      return "peer_" + Math.random().toString(36).slice(2, 12);
    },
    localPeerId: null,
    ensureLocalPeer() {
      if (!this.localPeerId) this.localPeerId = this.uuid();
      GlobalGameState.peers[this.localPeerId] = { id: this.localPeerId, t: Date.now() };
      return this.localPeerId;
    }
  };
  const NetworkCoordinator = {
    mode: "embedded",
    /** Dedicated Node host: per-slot inputs from sockets (see server). */
    _authoritativeRemoteInputs: null,
    ws: null,
    bc: null,
    peerId: PeerManager.ensureLocalPeer(),
    roomCode: "",
    hostSlots: {},
    remoteInputs: {},
    remoteActionSeqByPeer: {},
    localSlot: 0,
    inputSeq: 0,
    actionSeq: 0,
    lastAppliedTick: -1,
    connectedSlots: null,
    wsUrl: "",
    wsReconnectTimer: null,
    wsReconnectAttempt: 0,
    wsHeartbeatTimer: null,
    wsLastPongAt: 0,
    wsLastSnapshotAt: 0,
    wsEverReceivedSnapshot: false,
    _wsManualClose: false,
    wsConnected: false,
    wsConnectionState: "idle",
    wsDisconnectUiTimer: null,
    pendingWelcomeSlot: null,
    pendingWelcomeSlotCount: null,
    wsAckedMatchId: "",
    /** false only when live WS client connected and receiving snapshots */
    isAuthoritativeHost() {
      return this.mode !== "ws_client" && this.mode !== "local_client";
    },
    _logWs(tag, payload) {
      if (GameStateManager && GameStateManager._dbgLog) GameStateManager._dbgLog("ws " + tag, payload);
      else if (payload !== undefined) console.log("[WS]", tag, payload);
      else console.log("[WS]", tag);
    },
    _clearWsTimers() {
      if (this.wsReconnectTimer) clearTimeout(this.wsReconnectTimer);
      if (this.wsHeartbeatTimer) clearInterval(this.wsHeartbeatTimer);
      if (this.wsDisconnectUiTimer) clearTimeout(this.wsDisconnectUiTimer);
      this.wsReconnectTimer = null;
      this.wsHeartbeatTimer = null;
      this.wsDisconnectUiTimer = null;
    },
    _scheduleWsReconnect(reason) {
      if (this._wsManualClose || !this.wsUrl || typeof window === "undefined") return;
      if (this.wsReconnectTimer) return;
      const attempt = this.wsReconnectAttempt | 0;
      const delayMs = Math.min(12000, 2200 + Math.pow(2, Math.min(4, attempt)) * 300);
      this.wsReconnectAttempt = attempt + 1;
      this.wsReconnectTimer = setTimeout(() => {
        this.wsReconnectTimer = null;
        if (!this.ws && this.wsUrl) this.tryConnectWebSocket(this.wsUrl);
      }, delayMs);
      if (GameStateManager && GameStateManager._setHint && reason) {
        GameStateManager._setHint("Reconnecting: " + reason, "#ffd9a8", 1.8);
      }
    },
    _ensureSessionPlayersForCount(n) {
      const world = GameStateManager.world;
      if (!world) return;
      const wanted = clamp(n | 0, MULTI_MIN_SLOTS, MULTI_MAX_SLOTS);
      if (AuthoritativeSession.players.length === wanted) return;
      AuthoritativeSession.reset(world, wanted, c => NetworkManager.assignRoles(c));
      if (!NetworkCoordinator.connectedSlots || NetworkCoordinator.connectedSlots.length !== wanted) {
        NetworkCoordinator.connectedSlots = new Array(wanted).fill(false);
      }
      GameStateManager.player = GameStateManager._resolveLocalPlayer(AuthoritativeSession.players);
    },
    _applyPendingWelcome() {
      if (this.pendingWelcomeSlot != null) GameStateManager.localPlayerId = this.pendingWelcomeSlot | 0;
      if (this.pendingWelcomeSlotCount != null) this._ensureSessionPlayersForCount(this.pendingWelcomeSlotCount | 0);
    },
    closeCloudWebSocket() {
      this._wsManualClose = true;
      this._clearWsTimers();
      this.wsUrl = "";
      this.wsConnected = false;
      this.wsConnectionState = "disconnected";
      this.pendingWelcomeSlot = null;
      this.pendingWelcomeSlotCount = null;
      if (this.ws) {
        try { this.ws.close(); } catch (e) {}
        this.ws = null;
      }
      if (this.mode === "ws_client") this.mode = "embedded";
    },
    /** Dedicated host URL (set via GameStateManager._assignDedicatedCloudUrl). */
    tryConnectWebSocket(url) {
      if (!url || typeof WebSocket === "undefined") return;
      let connectUrl = String(url).trim();
      try {
        const pu = new URL(connectUrl);
        if (pu.pathname === "/" || pu.pathname === "") {
          pu.pathname = "/ws";
          connectUrl = pu.toString();
        }
      } catch (e) { /* use raw url */ }

          for (let i = 0; i < this.slotCount; i++) {

            const pl = new Player(this.world.spawn.x + ox, this.world.spawn.y + oy, {
              id: i,

              accentCircuit: PLAYER_SKINS[i % PLAYER_SKINS.length].circuit,
              accentVisor: PLAYER_SKINS[i % PLAYER_SKINS.length].visor

            right: !!(keys.right || keys.d || keys.arrowright),

  const LocalRoomService = {

      room.roomCode = code;
      room.connectedSlots = [true, false, false, false];
      room.peerBySlot = [NetworkCoordinator.peerId, null, null, null];

      const room = GlobalGameState.rooms[String(code || "").toUpperCase()];
      if (!room) return null;
      const pid = String(peerId || "");
      if (pid && Array.isArray(room.peerBySlot)) {
        for (let i = 0; i < room.peerBySlot.length; i++) {
          if (room.peerBySlot[i] === pid) return { room, slot: i };
        }

        if (!room.connectedSlots[i]) {
          room.connectedSlots[i] = true;

          return { room, slot: i };
        }
      }
      return null;

      const room = GlobalGameState.rooms[String(code || "").toUpperCase()];
      if (!room) return;
      const pid = String(peerId || "");
      if (Array.isArray(room.peerBySlot) && pid) {
        for (let i = 0; i < room.peerBySlot.length; i++) {
          if (room.peerBySlot[i] === pid) {
            room.peerBySlot[i] = null;
            room.connectedSlots[i] = false;
            break;
          }
        }

      if (room.connectedSlots.filter(Boolean).length === 0) {
        delete GlobalGameState.rooms[room.roomCode];
        delete GlobalGameState.hostByRoom[room.roomCode];

      for (let i = 0; i < room.slotCount; i++) {

    }
  };

  const PlayerController = {
    inputForSlot(keys, slot) {

        return {

          right: keys["d"] || keys["arrowright"],
          up: keys["w"] || keys["arrowup"],
          down: keys["s"] || keys["arrowdown"],
          sprint: keys["shift"]

          right: keys["l"],
          up: keys["i"],

          sprint: keys["q"] || keys["e"]

          up: keys["t"],
          down: keys["g"],

          up: keys["b"],

      return b * (pMul[personality] || 1);
    },
    buildChoices(npc, rng) {
      const personality = (npc && npc.personality) || "strict";
      const weights = this.personalityWeights(personality);
      const k = rng() > 0.42 ? 3 : 2;
      const used = new Set();
      const out = [];
      const poolKeys = ["neutral", "friendly", "suspicious", "aggressive", "casual"];
      for (let slot = 0; slot < k; slot++) {
        let line = null;
        let cat = null;
        for (let attempt = 0; attempt < 14 && !line; attempt++) {
          cat = this._weightedCategory(weights, rng);
          const pool = this.pools[cat] || this.pools.neutral;
          const pick = this._pick(pool, rng);
          if (pick && !used.has(pick.text)) {
            line = pick;
            used.add(pick.text);
          }
        }
        if (!line) {
          for (let pi = 0; pi < poolKeys.length && !line; pi++) {
            const pool = this.pools[poolKeys[pi]];
            for (let j = 0; j < pool.length; j++) {
              if (!used.has(pool[j].text)) {
                line = pool[j];
                cat = poolKeys[pi];
                used.add(line.text);
                break;
              }
            }
          }
        }
        if (!line) break;
        out.push({ id: slot + 1, text: line.text, category: cat });
      }
      const workerIntel = npc && npc.npcKind === "worker" && (npc.behavior === "watch" || npc.behavior === "ignore");
      if (workerIntel && out.length) {
        let hit = out.find(c => c.category === "suspicious");
        if (!hit) hit = out.find(c => c.category === "neutral");
        if (!hit) hit = out[0];
        hit.meta = "worker_intel";
      }
      return out;
    },
    resolveReply(npc, choice) {
      const personality = (npc && npc.personality) || "strict";
      const cat = (choice && choice.category) || "neutral";
      const bucket = (this.replies[personality] && this.replies[personality][cat]) || this.replies.strict.neutral;
      const rng = mulberry32((hashString32((npc && npc.cpuName) || "cpu") ^ hashString32(cat + "|" + String((choice && choice.text) || ""))) >>> 0);
      const text = this._pick(bucket, rng) || "Move along.";
      const suspiciousDelta = this.suspicionDelta(personality, cat);
      return { text, suspiciousDelta };
    },
    rngForSession(npc) {
      const t = performance.now();
      const gen = (npc && (npc._npcDialogueGen | 0)) >>> 0;
      const tick = (t >>> 0) ^ ((t * 0.001) >>> 0);
      return mulberry32((hashString32(String((npc && npc.x) | 0) + "|" + String((npc && npc.y) | 0) + "|" + (npc && npc.cpuName || "") + "|g" + gen) ^ tick) >>> 0);
    }
  };

  /**
   * Gameplay roles (helpful / neutral / hostile): hints, suspicion tuning, escalation.
   * Dialogue text pools and NpcDialogueEngine are unchanged — only outcomes and ambient pressure hook here.
   */
  const NpcRoleSystem = {
    computeRole(npc) {
      if (!npc) return "neutral";
      const kind = npc.npcKind || "worker";
      const p = npc.personality || "strict";
      const beh = npc.behavior || "ignore";
      if (kind === "informant") return "helpful";
      if (beh === "report") return "hostile";
      if (kind === "suspicious") {
        return beh === "watch" ? "neutral" : "hostile";
      }
      if (kind === "worker") {
        if (beh === "watch") {
          if (p === "friendly" || p === "glitchy") return "helpful";
          if (p === "strict" || p === "nervous") return "hostile";
          return "neutral";
        }
        if (p === "friendly" || p === "glitchy") return "helpful";
        return "neutral";
      }
      return "neutral";
    },
    roleOrCompute(npc) {
      return (npc && npc.npcGameplayRole) || this.computeRole(npc);
    },
    proximitySuspicionMul(npc) {
      const r = this.roleOrCompute(npc);
      if (r === "helpful") return 0.74;
      if (r === "hostile") return 1.2;
      return 0.96;
    },
    _sectorHint(px, py, tx, ty) {
      const dx = tx - px, dy = ty - py;
      const NS = dy < -55 ? "north" : dy > 55 ? "south" : "";
      const EW = dx < -55 ? "west" : dx > 55 ? "east" : "";
      if (!NS && !EW) return "close to you";
      if (NS && EW) return NS + "-" + EW;
      return NS || EW;
    },
    buildTacticalHint(world, player) {
      if (!world || !player) return "";
      const parts = [];
      const hacked = world.hackedTerminals || {};
      const terms = (world.terminals || []).filter(t => t.kind === "primary" && t.label && !TerminalState.isCompleted(t) && !hacked[t.id]);
      if (terms.length) {
        let best = terms[0], bd = 1e9;
        for (let i = 0; i < terms.length; i++) {
          const t = terms[i];
          const cx = t.x + t.w * 0.5, cy = t.y + t.h * 0.5;
          const d = Math.hypot(player.x - cx, player.y - cy);
          if (d < bd) { bd = d; best = t; }
        }
        const cx = best.x + best.w * 0.5, cy = best.y + best.h * 0.5;
        parts.push("Open relay " + (best.label || "NODE") + " — " + NpcRoleSystem._sectorHint(player.x, player.y, cx, cy) + " from here.");
      }
      const guards = world.guards || [];
      if (guards.length) {
        let gx = 0, gy = 0;
        for (let i = 0; i < guards.length; i++) {
          gx += guards[i].x;
          gy += guards[i].y;
        }
        gx /= guards.length;
        gy /= guards.length;
        const q = NpcRoleSystem._sectorHint(player.x, player.y, gx, gy);
        parts.push((guards.length >= 4 ? "Patrol weight " : "Watch bias ") + q + ".");
      }
      return parts.join(" ");
    },
    tryGrantHelpfulOpen(npc, gsm) {
      if (!npc || !gsm || npc.npcGameplayRole !== "helpful") return;
      const now = performance.now();
      if ((npc._helpfulHintCd || 0) > now) return;
      const hint = NpcRoleSystem.buildTacticalHint(gsm.world, gsm.player);
      if (hint) gsm._setHint("Tip — " + hint, "#9defff", 4.4);
      if (gsm.player) gsm.player.suspicion = clamp((gsm.player.suspicion || 0) - 3.4, 0, 100);
      npc._helpfulHintCd = now + 50000;
    },
    _reportWarnMs: 2480,
    _reportCooldownMs: 15800,
    _isHostileReporter(npc) {
      if (!npc) return false;
      const beh = npc.behavior || "ignore";
      if (beh === "report") return true;
      return this.roleOrCompute(npc) === "hostile";
    },
    _eligibleForDirectedReport(npc, player, near, close) {
      if (!npc || !player || !this._isHostileReporter(npc)) return false;
      const sus = player.suspicion || 0;
      const speed = player.getSpeed01();
      const oddBeh = speed > 0.72 || (speed < 0.11 && close);
      const dialogPrimed = (npc._hostileDialogPrimedUntil || 0) > performance.now();
      if (npc.behavior === "report") {
        return near && sus >= SOCIAL_REPORT_MIN_SUSPICION;
      }
      return near && close && (sus >= 48 || dialogPrimed || oddBeh);
    },
    _pickGuardForNpcReport(npc, player, guards) {
      if (!guards || !guards.length || !npc || !player) return null;
      let best = null, score = 1e18;
      for (let i = 0; i < guards.length; i++) {
        const g = guards[i];
        const dNpc = Math.hypot(g.x - npc.x, g.y - npc.y);
        const dPl = Math.hypot(g.x - player.x, g.y - player.y);
        const s = dNpc * 0.78 + dPl * 0.32;
        if (s < score) {
          score = s;
          best = g;
        }
      }
      return best;
    },
    _applyDirectedReport(npc, world, player, guards) {
      const g = this._pickGuardForNpcReport(npc, player, guards);
      if (!g || !world) return;
      world.alarm = clamp((world.alarm || 0) + 7.0, 0, 100);
      world.exposure = clamp((world.exposure || 0) + 4.6, 0, 100);
      g.lastKnown = { x: player.x, y: player.y };
      g.detect = clamp(g.detect + 34, 0, 84);
      if (g.aiState === "patrol") g._beginInvestigate({ x: player.x, y: player.y });
      else if (g.aiState === "investigate") {
        g.investigatePoint = { x: player.x, y: player.y };
        g.investigateTimer = Math.max(g.investigateTimer || 0, 3.4);
      } else {
        g.lastKnown = { x: player.x, y: player.y };
      }
      NetworkManager.pushAlert("npc_report", npc.x, npc.y);
    },
    tickDirectedNpcReport(npc, world, player, guards, near, close) {
      if (!npc || !player || !world || !guards || !guards.length) return;
      const now = performance.now();
      if ((npc._dirReportCdUntil || 0) > now) {
        if (npc._hrPhase === 1 && now >= (npc._hrWarnEnd || 0)) {
          npc._hrPhase = 0;
          npc._hrWarnEnd = 0;
          npc._hrWarnShown = false;
        }
        return;
      }
      if (!this._isHostileReporter(npc)) {
        npc._hrPhase = 0;
        return;
      }
      const elig = this._eligibleForDirectedReport(npc, player, near, close);
      if (!elig) {
        npc._hrPhase = 0;
        npc._hrWarnEnd = 0;
        npc._hrWarnShown = false;
        return;
      }
      if (!npc._hrPhase) {
        npc._hrPhase = 1;
        npc._hrWarnEnd = now + this._reportWarnMs;
        npc._hrWarnShown = false;
      }
      if (npc._hrPhase === 1) {
        if (!npc._hrWarnShown && typeof GameStateManager !== "undefined" && GameStateManager._setHint) {
          npc._hrWarnShown = true;
          const who = npc.cpuName || "Contact";
          GameStateManager._setHint(who + " — \"Something's not right…\" (back off)", "#ffccb0", 2.7);
        }
        if (now < (npc._hrWarnEnd || 0)) return;
        const still = this._eligibleForDirectedReport(npc, player, near, close);
        npc._hrPhase = 0;
        npc._hrWarnEnd = 0;
        npc._hrWarnShown = false;
        if (!still) return;
        this._applyDirectedReport(npc, world, player, guards);
        npc._dirReportCdUntil = now + this._reportCooldownMs;
        if (npc.behavior === "report") npc.reportCd = now + SOCIAL_REPORT_COOLDOWN_MS;
      }
    }
  };

  /** Short optional favors from friendly/neutral NPCs — no main objective block. */
  const NpcFavorSystem = {
    propose(world, npc, player) {
      if (!world || !npc || !player) return null;
      const rng = mulberry32((hashString32(String((npc.x | 0) + "|" + (npc.y | 0) + "|" + ((world.def && world.def.id) || 0))) ^ 0x5f6176f72) >>> 0);
      const ex = world.extraction;
      const roll = rng();
      if (ex && roll < 0.32) {
        return {
          type: "extraction_ping",
          offerText: "Quick favor — drift through the extraction tile like you belong. My mapper needs a ping.",
          ttl: 56,
          needHold: 1.55
        };
      }
      if (roll < 0.68) {
        const dx = (95 + rng() * 55) * (rng() > 0.48 ? 1 : -1);
        const dy = -55 - rng() * 55;
        return {
          type: "visit_marker",
          tx: npc.x + dx,
          ty: npc.y + dy,
          needNear: 76,
          holdSec: 1.2,
          offerText: "Can you shoulder-check that junction for me? Two beats under the blind spot, then peel off.",
          ttl: 62
        };
      }
      return {
        type: "linger_npc",
        radius: 118,
        needHold: 1.95,
        offerText: "Run a proximity handshake — two seconds in my bubble, slow feet. Routine cal.",
        ttl: 50
      };
    }
  };

  /** Small temporary perks from positive NPC chat — capped per mission, not stack-breaking. */
  const NpcBonusSystem = {
    _maxGrantsPerMission: 4,
    _npcCdMs: 50000,
    _procChance: 0.48,
    tryGrantFromPositiveChat(world, gsm, npc, choiceObj) {
      if (!world || !gsm || !npc || !choiceObj || !gsm.player) return;
      const cat = choiceObj.category;
      if (!(cat === "friendly" || cat === "casual" || cat === "neutral")) return;
      const role = npc.npcGameplayRole || NpcRoleSystem.computeRole(npc);
      if (role === "hostile") return;
      if (role !== "helpful" && role !== "neutral") return;
      const now = performance.now();
      if ((world.flags.npcBonusGrantsThisMission || 0) >= this._maxGrantsPerMission) return;
      if ((npc._npcBonusCdUntil || 0) > now) return;
      const seed = (hashString32(String((npc.cpuName || "n") + "|bon|" + ((world.def && world.def.id) | 0) + "|" + (choiceObj.id | 0))) ^ 0x6e706362) >>> 0;
      const rng = mulberry32(seed);
      if (role === "neutral" && rng() > 0.32) return;
      if (rng() > this._procChance) return;
      const k = rng() * 4 | 0;
      world.flags.npcBonusGrantsThisMission = (world.flags.npcBonusGrantsThisMission || 0) + 1;
      npc._npcBonusCdUntil = now + this._npcCdMs;
      const wf = world.flags;
      if (k === 0) {
        wf.npcBonusVisMulUntil = now + 9000;
        wf.npcBonusVisMul = clamp(wf.npcBonusVisMul || 0.87, 0.82, 0.92);
        gsm._setHint("Contact: soft sensor gloss on you (~9s).", "#a8f0ff", 2.75);
      } else if (k === 1) {
        wf.npcRelayPingUntil = now + 14000;
        const hint = NpcRoleSystem.buildTacticalHint(world, gsm.player);
        gsm._setHint(hint ? ("Relay ping — " + hint) : "Relay ping — uplink sketching nearest open relay.", "#9defff", 4.35);
      } else if (k === 2) {
        const guards = world.guards || [];
        let best = null, bd = 1e9;
        for (let i = 0; i < guards.length; i++) {
          const g = guards[i];
          if (!g || g.aiState === "chase") continue;
          const d = Math.hypot(g.x - gsm.player.x, g.y - gsm.player.y);
          if (d < bd) { bd = d; best = g; }
        }
        if (best) {
          best.npcBonusBlindUntil = now + 5200;
          gsm._setHint("Contact: one patrol's optics muddy (~5s).", "#c8e8ff", 2.55);
        } else {
          wf.npcBonusVisMulUntil = now + 9000;
          wf.npcBonusVisMul = 0.87;
          gsm._setHint("Contact: broad sensor gloss (~9s).", "#a8f0ff", 2.65);
        }
      } else {
        wf.npcHackSnappierUntil = now + 22000;
        wf.npcHackSnappierMul = 0.93;
        gsm._setHint("Contact: breach windows slightly snappier (~20s).", "#d4ffc8", 2.65);
      }
    }
  };

  /** Seeded relay breach generator with distinct puzzle styles per terminal. */
  const HackEngine = {
    themes: [
      { name: "Amber Grid", accent: "#ffcb57", done: "#ffd76f", idle: "rgba(74,58,28,0.78)", edgeIdle: "rgba(170,125,45,0.24)", edgeDone: "rgba(255,214,106,0.55)", edgeMode: "solid" },
      { name: "Cyan Mesh", accent: "#00f1df", done: "#00ffd8", idle: "rgba(36,66,70,0.78)", edgeIdle: "rgba(66,136,146,0.28)", edgeDone: "rgba(0,255,220,0.6)", edgeMode: "pulse" },
      { name: "Magenta Spike", accent: "#ff5ec6", done: "#ff7dd5", idle: "rgba(76,42,80,0.78)", edgeIdle: "rgba(135,78,150,0.25)", edgeDone: "rgba(255,122,214,0.6)", edgeMode: "dashed" }
    ],
    _pick(arr, rng) { return arr[(rng() * arr.length) | 0]; },
    _shuffle(arr, rng) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = (rng() * (i + 1)) | 0;
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    },
    _nodePos(slot, total, cx, cy, rng, spreadX, spreadY) {
      const tx = total <= 1 ? 0.5 : slot / (total - 1);
      const x = cx - spreadX + tx * spreadX * 2 + (rng() - 0.5) * 44;
      const wave = Math.sin(tx * Math.PI * (1.1 + rng() * 0.4)) * spreadY * (0.5 + rng() * 0.25);
      const y = cy + wave + (rng() - 0.5) * 72;
      return { x, y };
    },
    _makeLinearStage(rng, diff, style, stageIdx) {
      const count = clamp(4 + diff + ((stageIdx > 0 && rng() > 0.6) ? 1 : 0), 4, 8);
      const cx = VIEW_W * 0.5, cy = VIEW_H * (0.44 + rng() * 0.08);
      const nodes = [];
      const edges = [];
      const path = [];
      for (let i = 0; i < count; i++) {
        const p = this._nodePos(i, count, cx, cy, rng, 270, 130);
        nodes.push({ id: i, x: p.x, y: p.y, r: 17 });
        path.push(i);
        if (i > 0) edges.push([i - 1, i]);
      }
      return {
        styleType: "linear",
        durationSec: 5.4 + count * 0.55,
        nodes, edges, path,
        theme: style,
        timedWindowSec: diff >= 2 && rng() > 0.55 ? 1.45 - diff * 0.1 : 0,
        decoyIds: []
      };
    },
    _makeBranchStage(rng, diff, style, stageIdx) {
      const coreCount = clamp(4 + diff + (stageIdx > 0 ? 1 : 0), 4, 8);
      const cx = VIEW_W * 0.5, cy = VIEW_H * (0.44 + rng() * 0.1);
      const nodes = [];
      const edges = [];
      const path = [];
      for (let i = 0; i < coreCount; i++) {
        const p = this._nodePos(i, coreCount, cx, cy, rng, 280, 140);
        nodes.push({ id: i, x: p.x, y: p.y, r: 17 });
        path.push(i);
        if (i > 0) edges.push([i - 1, i]);
      }
      for (let i = 1; i < coreCount - 1; i++) {
        if (rng() < 0.9) {
          const a = i - 1;
          const b = Math.min(coreCount - 1, i + 1 + ((rng() > 0.6) ? 1 : 0));
          if (b > a + 1) edges.push([a, b]);
        }
      }
      return {
        styleType: "branching",
        durationSec: 5.8 + coreCount * 0.62,
        nodes, edges, path,
        theme: style,
        timedWindowSec: diff >= 2 && rng() > 0.7 ? 1.35 - diff * 0.08 : 0,
        decoyIds: []
      };
    },
    _sampleBezier(A, B, C, D, steps) {
      const out = [];
      const n = Math.max(8, steps | 0);
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const omt = 1 - t;
        const x = omt * omt * omt * A.x + 3 * omt * omt * t * B.x + 3 * omt * t * t * C.x + t * t * t * D.x;
        const y = omt * omt * omt * A.y + 3 * omt * omt * t * B.y + 3 * omt * t * t * C.y + t * t * t * D.y;
        out.push({ x, y });
      }
      return out;
    },
    _densifyPolyline(pts, maxSegLen) {
      if (!pts || pts.length < 2) return (pts || []).slice();
      const maxL = Math.max(10, maxSegLen || 16);
      const out = [{ x: pts[0].x, y: pts[0].y }];
      for (let i = 1; i < pts.length; i++) {
        const ax = out[out.length - 1].x, ay = out[out.length - 1].y;
        const bx = pts[i].x, by = pts[i].y;
        const L = Math.hypot(bx - ax, by - ay);
        const n = Math.max(1, Math.ceil(L / maxL));
        for (let k = 1; k <= n; k++) {
          const t = k / n;
          out.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t });
        }
      }
      return out;
    },
    _traceBuildCum(poly) {
      const cum = [0];
      let total = 0;
      for (let i = 1; i < poly.length; i++) {
        total += Math.hypot(poly[i].x - poly[i - 1].x, poly[i].y - poly[i - 1].y);
        cum.push(total);
      }
      return { cum, total: Math.max(total, 1) };
    },
    _makeTraceStage(rng, diff, style, stageIdx, missionProgTier) {
      const mpt = missionProgTier != null ? clamp(missionProgTier | 0, 0, 2) : 1;
      const cx = VIEW_W * 0.5, cy = VIEW_H * 0.46;
      let traceShape;
      if (mpt <= 0) {
        traceShape = rng() < 0.58 ? "curve" : "zigzag";
      } else if (mpt === 1) {
        const shapes = ["curve", "zigzag", "loop"];
        traceShape = shapes[(stageIdx + ((rng() * 3) | 0)) % 3];
      } else {
        const shapes = ["zigzag", "loop", "curve"];
        traceShape = shapes[(stageIdx + ((rng() * 3) | 0)) % 3];
      }
      let raw = [];
      if (traceShape === "curve") {
        const flip = rng() > 0.5 ? 1 : -1;
        const span = mpt <= 0 ? 198 : (mpt === 1 ? 240 : 268);
        const tight = mpt <= 0 ? 0.72 : (mpt === 1 ? 0.88 : 1);
        const A = { x: cx - span * flip, y: cy - 22 * tight + rng() * 28 * tight };
        const D = { x: cx + span * flip, y: cy + 18 * tight + rng() * 32 * tight };
        const B = { x: cx - (72 + diff * 8) * flip + rng() * 40 * tight, y: cy - (95 + diff * 8) * tight + rng() * 38 * tight };
        const C = { x: cx + (88 + diff * 8) * flip + rng() * 42 * tight, y: cy + (98 + diff * 10) * tight + rng() * 40 * tight };
        const steps = mpt <= 0 ? 36 + (diff | 0) * 2 : 48 + (diff | 0) * 4 + (mpt >= 2 ? 6 : 0);
        raw = this._sampleBezier(A, B, C, D, steps);
      } else if (traceShape === "zigzag") {
        const w = (mpt <= 0 ? 248 : (mpt === 1 ? 292 : 318)) + diff * (mpt <= 0 ? 12 : 26);
        const amp = (mpt <= 0 ? 62 : (mpt === 1 ? 82 : 96)) + diff * (mpt <= 0 ? 6 : 10);
        const steps = mpt <= 0
          ? clamp(3 + (rng() > 0.4 ? 1 : 0) + (diff >= 2 ? 1 : 0), 3, 5)
          : clamp(4 + (diff >= 2 ? 1 : 0) + ((rng() > 0.55) ? 1 : 0) + (mpt >= 2 ? 1 : 0), 4, 8);
        let x = cx - w * 0.5, y = cy;
        raw.push({ x, y });
        for (let i = 0; i < steps; i++) {
          x += w / steps;
          y = cy + (i % 2 === 0 ? -amp : amp);
          raw.push({ x, y });
        }
      } else {
        const rx = (mpt <= 0 ? 108 : (mpt === 1 ? 128 : 148)) + rng() * (mpt <= 0 ? 18 : 32);
        const ry = (mpt <= 0 ? 48 : (mpt === 1 ? 58 : 68)) + rng() * (mpt <= 0 ? 12 : 20);
        const loops = mpt >= 2 ? 62 : 56;
        for (let i = 0; i <= loops; i++) {
          const t = (i / loops) * Math.PI * 2;
          raw.push({ x: cx + Math.cos(t) * rx, y: cy + Math.sin(2 * t) * ry });
        }
      }
      const dens = mpt <= 0 ? 16 + (diff >= 2 ? 1 : 0) : (mpt === 1 ? 13 + (diff >= 2 ? 2 : 0) : 11 + diff);
      const tracePoly = this._densifyPolyline(raw, dens);
      const { cum: traceCum, total: traceTotalLen } = this._traceBuildCum(tracePoly);
      let durationSec = 12.8 + diff * 2.1 + (traceShape === "zigzag" ? 0.9 : 0) + (traceShape === "loop" ? 1.1 : 0);

      const stageLab = "STAGE " + (this.stageIndex + 1) + " / " + this.stages.length;
      ctx.save();
      const bgGrad = ctx.createRadialGradient(VIEW_W * 0.5, VIEW_H * 0.45, 40, VIEW_W * 0.5, VIEW_H * 0.5, VIEW_H * 0.7);
      bgGrad.addColorStop(0, wrongActive ? "rgba(55,0,25,0.97)" : "rgba(8,12,28,0.98)");
      bgGrad.addColorStop(1, "rgba(2,4,12,0.99)");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      for (let s = 0; s < 16; s++) {
        if (Math.random() < gAmt) {
          const yy = Math.random() * VIEW_H;
          const sh = 1 + Math.random() * 6;
          const ox = (Math.random() - 0.5) * 18 * gAmt;
          ctx.fillStyle = Math.random() > 0.5 ? "rgba(0,255,200,0.07)" : "rgba(255,40,120,0.07)";
          ctx.fillRect(ox, yy, VIEW_W, sh);
        }
      }
      if (wrongActive && Math.random() < 0.45) {
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(Math.random() * (VIEW_W - 120), Math.random() * (VIEW_H - 80), 100 + Math.random() * 80, 3);
      }
      if (this.isTraceStage()) {
        this._renderTraceVisuals(ctx, now, wrongActive, theme, stageLab, st);
        ctx.restore();
        return;
      }
      ctx.globalCompositeOperation = "lighter";
      for (const L of this.links) {
        const A = this.nodes.find(nn => nn.id === L.a), B = this.nodes.find(nn => nn.id === L.b);
        if (!A || !B) continue;
        const aDone = this.clicked.includes(A.id), bDone = this.clicked.includes(B.id);
        ctx.strokeStyle = aDone && bDone ? theme.edgeDone : theme.edgeIdle;
        ctx.lineWidth = aDone && bDone ? 3.5 : 2;
        if (theme.edgeMode === "dashed") ctx.setLineDash([8, 6]);
        else if (theme.edgeMode === "pulse") ctx.setLineDash([4 + Math.sin(now * 0.01) * 2, 5]);
        else ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.lineTo(B.x, B.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalCompositeOperation = "source-over";
      const next = this.solutionPath[this.expectedIndex];
      for (const n of this.nodes) {
        ctx.save();
        const stepIdx = this.solutionPath.indexOf(n.id);
        const inSequence = stepIdx >= 0;
        const done = this.clicked.includes(n.id);
        const isDecoy = this.decoyNodeSet.has(n.id);
        const isNext = n.id === next && !this.success;
        const isHover = n.id === this.hoverNodeId && isNext;
        const decoyPhase = now * 0.015 + n.id * 1.77;
        const decoyPulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(decoyPhase));
        const decoyFlicker = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(now * 0.042 + n.id * 2.31));
        const rr = isDecoy && !done ? (n.r + Math.sin(decoyPhase * 1.6) * 1.2) : n.r;
        ctx.shadowColor = done ? theme.done : (isHover || isNext ? theme.accent : (isDecoy ? "rgba(255,108,142," + (0.45 + 0.4 * decoyPulse) + ")" : "rgba(80,80,90,0.25)"));
        ctx.shadowBlur = done ? 20 : (isHover || isNext ? 26 : (isDecoy ? (8 + 10 * decoyPulse) : 5));
        ctx.beginPath();
        ctx.arc(n.x, n.y, rr, 0, Math.PI * 2);
        ctx.fillStyle = done
          ? hexToRgba(theme.done, 0.95)
          : (isNext ? hexToRgba(theme.accent, 0.86) : (isDecoy ? "rgba(118,34,58," + (0.45 + 0.28 * decoyFlicker) + ")" : (inSequence ? theme.idle : "rgba(38,42,52,0.62)")));
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = done
          ? theme.done
          : (isNext ? theme.accent : (isDecoy ? "rgba(255,112,156," + (0.55 + 0.4 * decoyPulse) + ")" : (inSequence ? "rgba(120,130,150,0.6)" : "rgba(90,100,120,0.35)")));
        ctx.lineWidth = isNext ? 3.8 : 2;
        ctx.stroke();
        ctx.fillStyle = "#061018";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        // Always show stable node IDs so players can see strict order cues.
        ctx.fillText(String(n.id + 1), n.x, n.y);
        if (inSequence || isDecoy) {
          ctx.fillStyle = isDecoy ? "rgba(255,132,168," + (0.45 + 0.4 * decoyPulse) + ")" : hexToRgba(theme.done, 0.88);
          ctx.font = "bold 9px monospace";
          ctx.fillText(isDecoy ? "?" : ("S" + String(stepIdx + 1)), n.x, n.y - rr - 8);
        }
        ctx.restore();
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.shadowColor = theme.accent;
      ctx.shadowBlur = 12;
      ctx.fillStyle = theme.accent;
      ctx.font = "bold 16px monospace";
      ctx.fillText("NEURAL TRACE — " + (st.styleType || this.relayType || "relay") + " breach", 40, 40);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#9ab";
      ctx.font = "12px monospace";
      ctx.fillText(stageLab + "  |  " + (theme.name || "Relay"), 40, 62);
      ctx.fillStyle = "#ddeeff";
      ctx.font = "12px monospace";
      if (next >= 0) ctx.fillText("Next node ID: " + (next + 1) + "  |  Step: " + (this.expectedIndex + 1), 40, 84);
      ctx.fillStyle = "#9ab";
      ctx.fillText("Nodes: " + this.clicked.length + "/" + this.solutionPath.length, 40, 104);
      ctx.fillText("Window: " + this.stageTimer.toFixed(1) + "s", 40, 124);
      if (this.activeTimedWindowSec > 0 && !this.success) {
        const tCol = this.stepTimer < 0.55 ? "#ff6d91" : "#9ab";
        ctx.fillStyle = tCol;
        ctx.fillText("Step timer: " + this.stepTimer.toFixed(1) + "s", 40, 144);
      }
      if (wrongActive) {
        ctx.fillStyle = "#ff6688";
        ctx.textAlign = "center";
        ctx.font = "bold 15px monospace";
        ctx.shadowColor = "#ff0044";
        ctx.shadowBlur = 8;
        ctx.fillText("DATA CORRUPTION — stage reset · grid alerted", VIEW_W / 2, VIEW_H - 28);
        ctx.shadowBlur = 0;
      }
      if (this.success) {
        const pulse = 1 + Math.sin(now * 0.012) * 0.06;
        ctx.save();
        ctx.translate(VIEW_W / 2, VIEW_H / 2);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = "#00ffcc";
        ctx.textAlign = "center";
        ctx.font = "bold 26px monospace";
        ctx.shadowColor = "#00ffaa";
        ctx.shadowBlur = 24;
        ctx.fillText("ACCESS GRANTED", 0, 0);
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      ctx.restore();
    }
  }

  class HackingSession {
    constructor(hackSystem) {
      this.hack = hackSystem;
      this.hacking = false;

    begin(onDone, onFail, onMistake) {
      this.hacking = true;
      activeHackingSession = this;
      this.hack.enter(() => { this.hacking = false; if (onDone) onDone(); }, () => { this.hacking = false; if (onFail) onFail(); }, onMistake);
    }
    end() {
      this.hacking = false;
      activeHackingSession = null;
      this.hack.exit();

  class MiniTaskSystem {
    constructor() {
      this.active = false;
      this.type = "";
      this.state = {};
      this.onDone = null;
      this.onFail = null;
    }
    start(spec, onDone, onFail) {
      this.active = true;
      this.type = (spec && spec.type) || "";
      this.onDone = onDone || null;
      this.onFail = onFail || null;
      if (this.type === "repair_hold") {
        this.state = { progress: 0, need: 2.8, ttl: 9.5 };
      } else if (this.type === "circuit_align") {
        this.state = { pieces: [1, 2, 3], target: [0, 0, 0], idx: 0, ttl: 18 };
      } else if (this.type === "timed_input") {
        this.state = { seq: ["KeyW", "KeyD", "KeyS", "KeyA"], idx: 0, ttl: 7.5 };
      } else {
        this.state = { ttl: 6 };
      }
    }
    stop(success) {
      const done = this.onDone, fail = this.onFail;
      this.active = false;
      this.type = "";
      this.state = {};
      this.onDone = null;
      this.onFail = null;
      if (success) { if (done) done(); }
      else { if (fail) fail(); }
    }
    handleKey(code) {
      if (!this.active) return false;
      if (this.type === "circuit_align") {
        if (code === "KeyW" || code === "ArrowUp") { this.state.idx = (this.state.idx + 2) % 3; return true; }
        if (code === "KeyS" || code === "ArrowDown") { this.state.idx = (this.state.idx + 1) % 3; return true; }
        if (code === "KeyA" || code === "ArrowLeft") { this.state.pieces[this.state.idx] = (this.state.pieces[this.state.idx] + 3) % 4; return true; }
        if (code === "KeyD" || code === "ArrowRight") { this.state.pieces[this.state.idx] = (this.state.pieces[this.state.idx] + 1) % 4; return true; }
        if (code === "Enter" || code === "Space") {
          const ok = this.state.pieces[0] === this.state.target[0] && this.state.pieces[1] === this.state.target[1] && this.state.pieces[2] === this.state.target[2];
          this.stop(ok);
          return true;
        }
      } else if (this.type === "timed_input") {
        const expect = this.state.seq[this.state.idx];
        if (!expect) return true;
        if (code === expect) {
          this.state.idx++;
          if (this.state.idx >= this.state.seq.length) this.stop(true);
        } else if (code === "KeyW" || code === "KeyA" || code === "KeyS" || code === "KeyD") {
          this.stop(false);
        }
        return true;
      }
      return false;
    }
    update(dt, gsm) {
      if (!this.active) return;
      this.state.ttl = (this.state.ttl || 0) - dt;
      if (this.state.ttl <= 0) { this.stop(false); return; }
      if (this.type === "repair_hold") {
        const p = gsm && gsm.player;
        const still = p && p.getSpeed01 && p.getSpeed01() < 0.08;
        const hold = gsm && gsm.keys && gsm.keys["e"];
        if (still && hold) this.state.progress = Math.min(this.state.need, this.state.progress + dt);
        else this.state.progress = Math.max(0, this.state.progress - dt * 1.25);
        if (this.state.progress >= this.state.need) this.stop(true);
      }
    }
    render(ctx) {
      if (!this.active) return;
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.fillStyle = "rgba(6,10,20,0.82)";
      ctx.fillRect(170, 130, VIEW_W - 340, 170);
      ctx.strokeStyle = "rgba(0,255,220,0.5)";
      ctx.strokeRect(170, 130, VIEW_W - 340, 170);
      ctx.fillStyle = "#bff";
      ctx.textAlign = "center";
      ctx.font = "bold 16px monospace";
      if (this.type === "repair_hold") {
        const pct = Math.round((this.state.progress / this.state.need) * 100);
        ctx.fillText("REPAIR TASK — HOLD E WHILE STANDING STILL", VIEW_W / 2, 168);
        ctx.font = "12px monospace";
        ctx.fillText("Progress " + pct + "%  |  Time " + this.state.ttl.toFixed(1) + "s", VIEW_W / 2, 196);
      } else if (this.type === "circuit_align") {
        ctx.fillText("CIRCUIT ALIGNMENT — MATCH ALL RINGS TO 0", VIEW_W / 2, 168);
        ctx.font = "12px monospace";
        ctx.fillText("W/S select ring  A/D rotate  Enter submit  |  " + this.state.pieces.join(" · "), VIEW_W / 2, 196);
      } else if (this.type === "timed_input") {
        ctx.fillText("TIMED INPUT — ENTER THE KEY SEQUENCE", VIEW_W / 2, 168);
        ctx.font = "12px monospace";
        ctx.fillText(this.state.seq.join("  ") + "   [" + this.state.idx + "/" + this.state.seq.length + "]  |  " + this.state.ttl.toFixed(1) + "s", VIEW_W / 2, 196);
      }
      ctx.restore();
    }
  }

  const ObjectiveEngine = {
    _grantSideReward(world, player, o) {
      world.flags.sideRewardsGranted = world.flags.sideRewardsGranted || {};
      const key = o && o.id ? o.id : ("side-" + (o && o.type ? o.type : "obj"));
      if (world.flags.sideRewardsGranted[key]) return;
      world.flags.sideRewardsGranted[key] = true;
      const reward = o && o.reward ? o.reward : "ui_bonus";
      if (reward === "hack_boost") {
        world.flags.hackSpeedBonus = Math.max(world.flags.hackSpeedBonus || 0, 0.16);
      } else if (reward === "stealth_buffer") {
        world.alarm = Math.max(0, (world.alarm || 0) - 10);
        world.exposure = Math.max(0, (world.exposure || 0) - 8);
        if (player) player.suspicion = Math.max(0, (player.suspicion || 0) - 12);
      } else {
        world.flags.uiBonusCount = (world.flags.uiBonusCount || 0) + 1;
      }
    },
    sync(world, player) {
      const obs = world.objectives || [];
      const need = world.minDwellSec != null ? world.minDwellSec : DEFAULT_MIN_DWELL_SEC;
      world.flags.dwellComplete = (world.missionElapsed || 0) >= need;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        if (i > 0 && !obs[i - 1].done) continue;
        if (o.type === "primary") o.done = !!world.primaryDone;
        if (o.type === "extraction" && world.extraction) {
          const ex = world.extraction;
          const priorOk = i === 0 || obs.slice(0, i).every(p => p.done);
          const inZone = player.x > ex.x && player.x < ex.x + ex.w && player.y > ex.y && player.y < ex.y + ex.h;
          const blockedByFailure = !!(world.flags && world.flags.systemFailureActive);
          o.done = priorOk && inZone && !blockedByFailure;
        }
      }
      const requiredDone = obs.filter(o => !o.optional).every(o => !!o.done);
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        if (!o.optional) continue;
        if (o.type === "bonus_data") {
          o.done = !!world.flags.bonusDataDownloaded;
        } else if (o.type === "speed_run") {
          const t = o.thresholdSec != null ? o.thresholdSec : ((world.minMissionSec || DEFAULT_MIN_MISSION_SEC) + 70);
          o.done = requiredDone && (world.missionElapsed || 0) <= t;
        } else if (o.type === "no_alarm") {
          o.done = requiredDone && (world.flags.maxAlarm || 0) < 36;
        } else if (o.type === "disable_security") {
          o.done = !!world.camerasDisabled;
        }
        if (o.done) this._grantSideReward(world, player, o);
      }
    }
  };

      let next = (gsm.missionId | 0) + 1;

        gsm.startPostLevel1Cutscene();
      } else if ((gsm.missionId | 0) === 2) {

  const AISystem = {
    tickGuards(dt, world, targets) {

        G[i].update(dt, targets, world, world.flags || null);

    tickSocial(dt, world, player, gsm) {
      const npcs = world.npcs || [];
      for (let i = 0; i < npcs.length; i++) {
        npcs[i].update(dt, world, player, world.guards || []);
      }
      if (!world.flags) world.flags = {};
      const terminals = world.terminals || [];
      let nearObjective = false;
      for (let i = 0; i < terminals.length; i++) {
        const t = terminals[i];
        const cx = t.x + t.w * 0.5, cy = t.y + t.h * 0.5;
        if (Math.hypot(player.x - cx, player.y - cy) < 140) { nearObjective = true; break; }
      }
      world.flags.objectiveLoiter = nearObjective ? (world.flags.objectiveLoiter || 0) + dt : 0;
      if (nearObjective && (world.flags.objectiveLoiter || 0) > 1.7) {
        player.suspicion = clamp(player.suspicion + dt * 5.5, 0, 100);

      if (gsm && gsm.mode === "hack" && gsm.pendingTerminal) {
        const t = gsm.pendingTerminal;
        const tx = t.x + t.w * 0.5, ty = t.y + t.h * 0.5;
        for (let i = 0; i < npcs.length; i++) {
          const n = npcs[i];
          if (Math.hypot(n.x - tx, n.y - ty) < 220 && !visionBlocked(n.x, n.y, tx, ty, world.walls, world.cover)) {
            player.suspicion = clamp(player.suspicion + dt * 8.2, 0, 100);
            break;
          }
        }
      }
      if (player.fakeTaskTimer > 0) {
        let nearObserver = false;
        for (let ni = 0; ni < npcs.length; ni++) {
          const n = npcs[ni];
          const d = Math.hypot(n.x - player.x, n.y - player.y);
          if (d < 200 && !visionBlocked(n.x, n.y, player.x, player.y, world.walls, world.cover)) { nearObserver = true; break; }
        }
        if (!nearObserver) {
          const Gs = world.guards || [];
          for (let gi = 0; gi < Gs.length; gi++) {
            const g = Gs[gi];
            const d = Math.hypot(g.x - player.x, g.y - player.y);
            if (d < 250 && !visionBlocked(g.x, g.y, player.x, player.y, world.walls, world.cover)) { nearObserver = true; break; }
          }
        }
        if (nearObserver) {
          const drain = player.fakeTaskTimer > 3.2 ? 4.5 : 3.0;
          player.suspicion = clamp(player.suspicion - dt * drain, 0, 100);

        player.suspicion = clamp(player.suspicion + dt * 7.8, 0, 100);

      if (player && player.getSpeed01() < 0.22) {

      }
      if (player.suspicion > 70) {
        const guards = world.guards || [];
        let gBest = null, bestD = 1e9;
        for (let i = 0; i < guards.length; i++) {
          const g = guards[i];
          const d = Math.hypot(g.x - player.x, g.y - player.y);
          if (d < bestD) { bestD = d; gBest = g; }

        if (gBest) {

  /**
   * GameEngine — authoritative simulation tick (host only).
   */
  const GameEngine = {
    tick(dt, gsm) {
      if (gsm.currentState === STATES.HACKING || gsm.mode === "hack") return;
      const w = gsm.world;
      const now = performance.now();
      w.missionElapsed = (w.missionElapsed || 0) + dt;
      const pls = AuthoritativeSession.players;
      const playerColliders = (w.walls || []).concat(w.cover || []);
      for (let s = 0; s < pls.length; s++) {
        const inp = NetworkCoordinator.inputForSlot(s, gsm.keys);
        pls[s].update(dt, inp, playerColliders);
        pls[s].x = clamp(pls[s].x, pls[s].radius, w.worldW - pls[s].radius);
        pls[s].y = clamp(pls[s].y, pls[s].radius, w.worldH - pls[s].radius);
        pls[s].fakeTaskTimer = Math.max(0, (pls[s].fakeTaskTimer || 0) - dt);
      }
      if (w.flags) {
        if (w.flags.doorSabotageRevert && now >= w.flags.doorSabotageRevert.until) {
          const dr = w.flags.doorSabotageRevert;
          w.doorsOpen[dr.id] = !!dr.restoreOpen;
          w.flags.doorSabotageRevert = null;
          if (gsm.rebuildWalls) gsm.rebuildWalls();
        }
        const locks = w.flags.terminalSabotageLocks;
        if (locks) {
          for (const k of Object.keys(locks)) {
            if (locks[k] <= now) delete locks[k];
          }
        }
      }
      if (gsm.player && gsm.player.getSpeed01 && gsm.player.getSpeed01() > 0.26) SFX.play("footstep_soft");
      separateCircles(pls, playerColliders);
      if (w.flags.guardFocus && now > w.flags.guardFocus.until) w.flags.guardFocus = null;
      if (w.flags.guardInvestigate && now > w.flags.guardInvestigate.until) w.flags.guardInvestigate = null;
      gsm.player = gsm._resolveLocalPlayer(pls);
      const p = gsm.player;
      if (!p) return;
      const targets = gsm.allOperatives();
      for (let i = 0; i < targets.length; i++) {
        const op = targets[i];
        const tense = clamp(op.suspicion / 100, 0, 1);
        op.socialPulse = Math.max(op.socialPulse || 0, tense > 0.45 ? 0.65 : 0);
      }
      AISystem.tickGuards(dt, w, targets);
      AISystem.tickSocial(dt, w, p, gsm);
      const guards = w.guards || [];
      for (let gi = 0; gi < guards.length; gi++) {
        const g = guards[gi];
        g.x = clamp(g.x, g.radius, w.worldW - g.radius);
        g.y = clamp(g.y, g.radius, w.worldH - g.radius);
      }
      const npcs = w.npcs || [];
      for (let ni = 0; ni < npcs.length; ni++) {
        const n = npcs[ni];
        n.x = clamp(n.x, n.radius, w.worldW - n.radius);
        n.y = clamp(n.y, n.radius, w.worldH - n.radius);
      }
      const camJam = w.flags.cameraJamUntil && now < w.flags.cameraJamUntil;
      w.cameras.forEach(c => c.update(dt));
      if (!w.camerasDisabled && !camJam) {
        w.cameras.forEach(c => {
          if (!c.active) return;
          const seen = targets.some(pl => c.sees(pl.x, pl.y, w.walls, w.cover));
          if (seen) w.alarm = clamp(w.alarm + dt * CAM_ALARM_PER_SEC, 0, 100);
        });
      }
      w.alarm = Math.max(0, w.alarm - dt * ALARM_DECAY_PER_SEC);
      w.flags.maxAlarm = Math.max(w.flags.maxAlarm || 0, w.alarm || 0);
      if (w.alarm > RED_ALERT_ALARM_ENTER) {
        w.flags.redAlertTimer = (w.flags.redAlertTimer != null ? w.flags.redAlertTimer : RED_ALERT_COUNTDOWN_SEC) - dt;
      } else {
        w.flags.redAlertTimer = null;
      }
      if (w.flags.fakeAlarmUntil && now < w.flags.fakeAlarmUntil) {
        w.alarm = clamp(w.alarm + dt * 3.6, 0, 100);
      }
      NetworkManager.pruneAlerts();
      DetectionSystem.tick(dt, w, gsm);
      if (gsm.updateDynamicEvents) gsm.updateDynamicEvents(now);
      MissionSystem.sync(w, p);
      if (w.def && w.def.lockdownSec && w.primaryDone) {
        const lockdownMs = (w.def.lockdownSec || 50) * 1000;
        if (!w.flags.lockdownStartedAt) {
          w.flags.lockdownStartedAt = now;
          w.flags.lockdownEndsAt = now + lockdownMs;
          w.flags.lockdownActive = true;
          const speedMul = w.def.lockdownGuardSpeedMul || 1.12;
          const chaseMul = w.def.lockdownGuardChaseMul || 1.1;
          for (let i = 0; i < guards.length; i++) {
            const g = guards[i];
            if (g._baseSpeed == null) g._baseSpeed = g.speed;
            if (g._baseChaseSpeed == null) g._baseChaseSpeed = g.chaseSpeed;
            g.speed = g._baseSpeed * speedMul;
            g.chaseSpeed = g._baseChaseSpeed * chaseMul;
          }
          gsm._setHint("LOCKDOWN ACTIVE — reach extraction before timer expires.", "#ffb98a", 3.0);
        }
        if (w.flags.lockdownEndsAt) {
          w.flags.lockdownRemainingSec = Math.max(0, (w.flags.lockdownEndsAt - now) / 1000);
          if (w.flags.lockdownRemainingSec <= 0 && !MissionSystem.isComplete(w)) {
            gsm.triggerFail();
            return;
          }
        }
      } else if (w.flags) {
        w.flags.lockdownActive = false;
      }

      gsm._smoothCameraToward(gsm.player, w, dt);
      gsm.shake *= 0.9;

      if (MissionSystem.isComplete(w)) gsm.triggerWin();

      AuthoritativeSession.serverTick++;
      AuthoritativeSession.broadcastSnapshot(w);
    }
  };

    mode: "solo",
    maxSlots: 4,
    roles: ["saboteur"],
    alerts: [],
    sessionSeed: 0x9e3779b9,
    touchSession() {
      let s = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
      if (!s) s = 0xdeadbeef;
      this.sessionSeed = s;
    },
    /** Legacy non-lobby role table (kept for compatibility). */
    assignRoles(slotCount) {
      const n = clamp(slotCount || 1, 1, 4);
      if (n === 1) return ["saboteur"];
      if (n === 2) return ["saboteur", "security_agent"];
      if (n === 3) return ["saboteur", "security_agent", "technician"];
      return ROLE_TABLE_4P.slice();
    },
    assignLegacySocialRoles(slotCount) {
      const n = clamp(slotCount || 1, 1, 4);
      if (n === 1) return ["saboteur"];
      const rng = mulberry32(this.sessionSeed >>> 0);
      const roles = new Array(n).fill("security_agent");
      roles[0] = "saboteur";
      if (n >= 3 && rng() > 0.35) roles[1] = "saboteur";
      else if (n >= 2) roles[1] = "security_agent";
      for (let i = 2; i < n; i++) {
        const r = rng();
        roles[i] = r < 0.48 ? "security_agent" : "saboteur";
      }
      if (!roles.includes("saboteur")) roles[0] = "saboteur";
      return roles;
    },
    pushAlert(kind, x, y) {
      this.alerts.push({ kind, x, y, t: performance.now() });
      while (this.alerts.length > 12) this.alerts.shift();
      if (kind === "npc_report" || kind === "hack_failed" || kind === "trace_noise" || kind === "fake_alarm") {
        SFX.play("alarm_ping");
      }
    },
    snapshot(world, players) {
      return { t: performance.now(), alarm: world.alarm, roles: this.roles.slice(), alerts: this.alerts.slice(-6), players: players.map(p => ({ id: p.id, x: p.x, y: p.y, role: p.role, suspicion: p.suspicion })) };
    },
    pruneAlerts() {
      const now = performance.now();
      this.alerts = this.alerts.filter(a => now - a.t < 5000);
    }
  };

  const SideObjectiveFactory = {
    build(def, worldW, worldH) {
      const objectives = [];
      const terminals = [];
      const sid = "m" + String(def.id || 0);
      // Hidden data terminal objective (optional) for strategic detour.
      objectives.push({
        id: sid + "-side-data",
        slot: "S1",
        type: "bonus_data",
        optional: true,
        reward: "hack_boost",
        label: "Download hidden data cache"
      });
      // Alternate optional objective rotates by mission id to keep variety.
      if (((def.id || 0) % 2) === 0) {
        objectives.push({
          id: sid + "-side-silent",
          slot: "S2",
          type: "no_alarm",
          optional: true,
          reward: "stealth_buffer",
          label: "Finish without major alarm"
        });
      } else {
        const threshold = Math.max(220, (def.minMissionSec || DEFAULT_MIN_MISSION_SEC) + 60);
        objectives.push({
          id: sid + "-side-speed",
          slot: "S2",
          type: "speed_run",
          thresholdSec: threshold,
          optional: true,
          reward: "ui_bonus",
          label: "Complete under " + threshold + "s"
        });
      }
      const tx = clamp(worldW * 0.78, 140, worldW - 180);
      const ty = clamp(worldH * 0.22, 110, worldH - 160);
      terminals.push({ id: sid + "-cache", x: tx, y: ty, w: 74, h: 42, kind: "bonus_data", label: "DATA CACHE" });
      const lx = clamp(worldW * 0.32, 120, worldW - 180);
      const ly = clamp(worldH * 0.68, 120, worldH - 160);
      terminals.push({ id: sid + "-lore", x: lx, y: ly, w: 74, h: 42, kind: "lore_log", label: "ARCHIVE LOG" });
      const rx = clamp(worldW * 0.18, 100, worldW - 180);
      const ry = clamp(worldH * 0.22, 100, worldH - 140);
      terminals.push({ id: sid + "-repair", x: rx, y: ry, w: 74, h: 42, kind: "repair_task", label: "FIELD REPAIR" });
      const cx = clamp(worldW * 0.52, 100, worldW - 180);
      const cy = clamp(worldH * 0.78, 100, worldH - 140);
      terminals.push({ id: sid + "-circuit", x: cx, y: cy, w: 74, h: 42, kind: "circuit_task", label: "CIRCUIT" });
      const tx2 = clamp(worldW * 0.86, 100, worldW - 180);
      const ty2 = clamp(worldH * 0.5, 100, worldH - 140);
      terminals.push({ id: sid + "-timed", x: tx2, y: ty2, w: 74, h: 42, kind: "timed_input_task", label: "AUTH INPUT" });
      const ax = clamp(worldW * 0.1, 90, worldW - 170);
      const ay = clamp(worldH * 0.55, 90, worldH - 130);
      const ux = clamp(worldW * 0.9, 100, worldW - 170);
      const uy = clamp(worldH * 0.12, 90, worldH - 130);
      terminals.push({ id: sid + "-card-pickup", x: ax, y: ay, w: 70, h: 40, kind: "access_card_pickup", label: "ACCESS CARD" });
      terminals.push({ id: sid + "-card-use", x: ux, y: uy, w: 76, h: 42, kind: "access_card_use", label: "CARD READER" });
      return { objectives, terminals };
    }
  };

  const MissionLoader = {
    load(mid) {
      const def = MISSIONS[mid];
      if (!def) return null;
      const w = def.worldW, h = def.worldH;
      const wallsRaw = def.walls(w,h);
      const doorsOpen = {};
      wallsRaw.forEach(W => { if (W.door && W.id) doorsOpen[W.id] = false; });
      const spawn = { x: def.spawn.x, y: def.spawn.y };
      const guards = def.guards();
      const npcs = def.npcs ? def.npcs() : [];
      const objectives = (def.objectives || [{ type: "primary" }]).map(o => Object.assign({}, o, { done: false }));
      const sidePack = SideObjectiveFactory.build(def, w, h);
      if (sidePack && sidePack.objectives) {
        for (let i = 0; i < sidePack.objectives.length; i++) {
          objectives.push(Object.assign({}, sidePack.objectives[i], { done: false }));
        }
      }
      const terminals = def.terminals();
      if (sidePack && sidePack.terminals) {
        for (let i = 0; i < sidePack.terminals.length; i++) terminals.push(Object.assign({}, sidePack.terminals[i]));
      }
      const world = {
        def, worldW:w, worldH:h, spawn,
        wallsAll: wallsRaw,
        doorsOpen,
        cover: def.cover.slice(),
        guards,
        npcs,
        cameras: def.cameras(),
        terminals,
        hack: HackEngine.deepBreach(),
        extraction: def.extraction,
        camerasDisabled: false,
        alarm: 0,
        primaryDone: false,
        primaryProgress: 0,
        primaryRequired: def.primaryRequired != null ? def.primaryRequired : 1,
        hackedTerminals: {},
        objectives,
        missionElapsed: 0,
        minDwellSec: def.minDwellSec != null ? def.minDwellSec : DEFAULT_MIN_DWELL_SEC,
        minMissionSec: def.minMissionSec != null ? def.minMissionSec : DEFAULT_MIN_MISSION_SEC,
        flags: { package: false, sabotageCooldown: 0, blackoutUntil: 0, cameraJamUntil: 0, fakeAlarmUntil: 0, guardFocus: null, guardInvestigate: null, maxAlarm: 0, bonusDataDownloaded: false, hackSpeedBonus: 0, uiBonusCount: 0, sideRewardsGranted: {}, lumenSapUntil: 0, terminalSabotageLocks: {}, doorSabotageRevert: null }
      };
      world.flags.loreIndex = 0;
      world.flags.loreFragments = [];
      for (let ti = 0; ti < world.terminals.length; ti++) TerminalState.ensure(world.terminals[ti]);
      world.walls = MissionLoader.solidWalls(world);
      DetectionSystem.init(world);
      MissionSystem.init(world);
      return world;
    },
    solidWalls(world) {
      return world.wallsAll.filter(W => !W.door || !world.doorsOpen[W.id]);
    }
  };

    _probeSabotageTarget() {

      const R = 238;
      const R2 = R * R;
      let best = null;
      let bestD2 = 1e15;
      const tryBest = (d2, pri, payload) => {
        if (d2 > R2) return;

        tryBest(dx * dx + dy * dy, 0, { kind: "terminal", terminal: t });

      const walls = w.wallsAll || [];
