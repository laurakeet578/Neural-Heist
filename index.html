      const glitch = this.postLevel4CutsceneFlash;
      this._drawCutsceneScene("post_level4_cutscene", idx, this.postLevel4CutsceneTimer, this.postLevel4CutsceneFlash);
      this._drawCutsceneStoryboardHud(ctx, "post_level4_cutscene", idx, 12);
      const isActionLine4 = this._cutsceneIsActionLine(full);
      const panelX = 92, panelY = 146, panelW = VIEW_W - 184, panelH = VIEW_H - 270;
      ctx.fillStyle = "rgba(6,7,17,0.62)";
      ctx.fillRect(panelX, panelY, panelW, panelH);
      ctx.strokeStyle = "rgba(255,110,190," + (0.22 + pulse * 0.44).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelW, panelH);
      ctx.textAlign = "center";
      ctx.fillStyle = "#b4f4ff";
      ctx.font = "12px monospace";
      ctx.fillText("SECURITY CASCADE // ACTIVE RESPONSE DETECTED", VIEW_W / 2, panelY + 34);
      const isWatching = shown.indexOf("Something is watching") >= 0;
      if (!isActionLine4) {
        ctx.fillStyle = isWatching ? "#ffd4ea" : "#cff8ff";
        ctx.font = "bold 26px monospace";
        ctx.shadowColor = "rgba(120,240,255,0.42)";
        ctx.shadowBlur = 16 + glitch * 20;
        if (isWatching) {
          const ox = Math.sin(t * 11.2) * (2 + glitch * 3);
          const oy = Math.cos(t * 9.8) * (1.5 + glitch * 2);
          ctx.fillText(shown, VIEW_W / 2 + ox, panelY + panelH * 0.56 + oy);
        } else {
          ctx.fillText(shown.length ? shown : " ", VIEW_W / 2, panelY + panelH * 0.56);
        }
      }
      ctx.shadowBlur = 0;
      const progress = clamp((idx + (this.postLevel4CutsceneTimer > 0 ? 0.2 : 0)) / sequence.length, 0, 1);
      const barW = panelW - 70;
      const barX = panelX + 35;
      const barY = panelY + panelH - 42;
      ctx.strokeStyle = "rgba(0,255,220,0.5)";
      ctx.strokeRect(barX, barY, barW, 9);
      ctx.fillStyle = "rgba(0,255,220,0.42)";
      ctx.fillRect(barX + 1, barY + 1, (barW - 2) * progress, 7);
      if (isActionLine4) {
        const dur = this._cutsceneHudLineDur || 1;
        const prog = clamp(this.postLevel4CutsceneTimer / dur, 0, 1);
        this._cutsceneRenderActionEffects(prog, glitch, t, full);
      }
      const hintA = 0.58 + Math.sin(this.postLevel4CutsceneSkipHintPulse) * 0.34;
      ctx.fillStyle = "rgba(176,234,250," + hintA.toFixed(3) + ")";
      ctx.font = "12px monospace";
      ctx.fillText("Press Space, Enter, Esc, R, or click to skip", VIEW_W / 2, VIEW_H - 58);
    },
    drawPostLevel5Cutscene() {
      const sequence = [
        "\"Nyx... listen carefully.\"",
        "\"This isn't just a system.\"",
        "[PAUSE]",
        "\"It's adapting.\"",
        "[GLITCH]",
        "\"If you finish this...\"",
        "\"...it will know you.\""
      ];
      const idx = Math.min(this.postLevel5CutsceneLineIndex, sequence.length - 1);
      const full = sequence[idx] || "";
      const shown = this._cutsceneDialogueText(full).slice(0, Math.max(0, Math.floor(this.postLevel5CutsceneLineReveal)));
      const t = VisualJuice.uiT;
      const pulse = 0.42 + Math.sin(t * 11.2) * 0.24;
      const glitch = this.postLevel5CutsceneFlash;
      this._drawCutsceneScene("post_level5_cutscene", idx, this.postLevel5CutsceneTimer, this.postLevel5CutsceneFlash);
      this._drawCutsceneStoryboardHud(ctx, "post_level5_cutscene", idx, 12);
      const isActionLine5 = this._cutsceneIsActionLine(full);
      const panelX = 86, panelY = 138, panelW = VIEW_W - 172, panelH = VIEW_H - 248;
      ctx.fillStyle = "rgba(6,6,16,0.64)";
      ctx.fillRect(panelX, panelY, panelW, panelH);
      ctx.strokeStyle = "rgba(255,120,200," + (0.2 + pulse * 0.46).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelW, panelH);
      ctx.textAlign = "center";
      ctx.fillStyle = "#baf6ff";
      ctx.font = "12px monospace";
      ctx.fillText("CORE THRESHOLD // FINAL LEVEL WARNING", VIEW_W / 2, panelY + 34);
      const isKnow = shown.indexOf("it will know you") >= 0;
      if (!isActionLine5) {
        ctx.fillStyle = isKnow ? "#ffd4ea" : "#d3f9ff";
        ctx.font = "bold 25px monospace";
        ctx.shadowColor = "rgba(130,245,255,0.45)";
        ctx.shadowBlur = 18 + glitch * 22;
        if (isKnow || shown.startsWith("\"It's adapting.\"")) {
          const ox = Math.sin(t * 10.5) * (2.5 + glitch * 3.5);
          const oy = Math.cos(t * 8.9) * (2 + glitch * 2.5);
          ctx.fillText(shown, VIEW_W / 2 + ox, panelY + panelH * 0.56 + oy);
        } else {
          ctx.fillText(shown.length ? shown : " ", VIEW_W / 2, panelY + panelH * 0.56);
        }
      }
      ctx.shadowBlur = 0;
      const progress = clamp((idx + (this.postLevel5CutsceneTimer > 0 ? 0.18 : 0)) / sequence.length, 0, 1);
      const barW = panelW - 68;
      const barX = panelX + 34;
      const barY = panelY + panelH - 44;
      ctx.strokeStyle = "rgba(0,255,220,0.5)";
      ctx.strokeRect(barX, barY, barW, 9);
      ctx.fillStyle = "rgba(0,255,220,0.42)";
      ctx.fillRect(barX + 1, barY + 1, (barW - 2) * progress, 7);
      if (isActionLine5) {
        const dur = this._cutsceneHudLineDur || 1;
        const prog = clamp(this.postLevel5CutsceneTimer / dur, 0, 1);
        this._cutsceneRenderActionEffects(prog, glitch, t, full);
      }
      const hintA = 0.6 + Math.sin(this.postLevel5CutsceneSkipHintPulse) * 0.32;
      ctx.fillStyle = "rgba(180,236,250," + hintA.toFixed(3) + ")";
      ctx.font = "12px monospace";
      ctx.fillText("Press Space, Enter, Esc, R, or click to skip", VIEW_W / 2, VIEW_H - 56);
    },
    drawFinalCutscene() {
      const sequence = [
        "[ALARMS DISTORT]",
        "SYSTEM:",
        "\"CORE INSTABILITY DETECTED\"",
        "[GLITCH]",
        "\"UNAUTHORIZED ACCESS - AGENT: NYX\"",
        "[PAUSE]",
        "VOICE (calm, different):",
        "\"...found you.\"",
        "[BLACK SCREEN]",
        "\"You were never outside the system.\"",
        "[FLASH - CITY LIGHTS]",
        "\"You were inside it the whole time.\"",
        "[STATIC]",
        "\"Connection... maintained.\"",
        "[FINAL GLITCH]"
      ];
      const idx = Math.min(this.finalCutsceneLineIndex, sequence.length - 1);
      const full = sequence[idx] || "";
      const shown = this._cutsceneDialogueText(full).slice(0, Math.max(0, Math.floor(this.finalCutsceneLineReveal)));
      const isActionLine = this._cutsceneIsActionLine(full);
      const t = VisualJuice.uiT;
      const pulse = 0.4 + Math.sin(t * 12.5) * 0.26;
      const glitch = this.finalCutsceneFlash;
      const isBlackBeat = isActionLine && this._parseCutsceneCue(full) === "black_screen";
      this._drawCutsceneScene("final_cutscene", idx, this.finalCutsceneTimer, this.finalCutsceneFlash);
      this._drawCutsceneStoryboardHud(ctx, "final_cutscene", idx, 12);
      const panelX = 76, panelY = 122, panelW = VIEW_W - 152, panelH = VIEW_H - 214;
      if (!isBlackBeat) {
        ctx.fillStyle = "rgba(6,6,16,0.64)";
        ctx.fillRect(panelX, panelY, panelW, panelH);
        ctx.strokeStyle = "rgba(255,130,210," + (0.2 + pulse * 0.52).toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(panelX, panelY, panelW, panelH);
      }
      ctx.textAlign = "center";
      if (!isBlackBeat) {
        ctx.fillStyle = "#c2f8ff";
        ctx.font = "12px monospace";
        ctx.fillText("NEURAL GRID // TERMINAL EVENT", VIEW_W / 2, panelY + 34);
      }
      const isTwist = shown.indexOf("never outside") >= 0 || shown.indexOf("inside it the whole time") >= 0;
      const isKnow = shown.indexOf("found you") >= 0 || shown.indexOf("know you") >= 0;
      if (!isActionLine) {
        ctx.fillStyle = isTwist ? "#ffe0ee" : "#ddfbff";
        ctx.font = "bold 25px monospace";
        ctx.shadowColor = isTwist ? "rgba(255,190,230,0.5)" : "rgba(130,245,255,0.48)";
        ctx.shadowBlur = 18 + glitch * 24;
        const textY = isBlackBeat ? (VIEW_H * 0.52) : (panelY + panelH * 0.56);
        if (isTwist || isKnow) {
          const ox = Math.sin(t * 10.8) * (3 + glitch * 4);
          const oy = Math.cos(t * 9.1) * (2.5 + glitch * 3);
          ctx.fillText(shown.length ? shown : " ", VIEW_W / 2 + ox, textY + oy);
        } else {
          ctx.fillText(shown.length ? shown : " ", VIEW_W / 2, textY);
        }
      }
      ctx.shadowBlur = 0;
      if (isActionLine) {
        const dur = this._cutsceneHudLineDur || 1;
        const prog = clamp(this.finalCutsceneTimer / dur, 0, 1);
        this._cutsceneRenderActionEffects(prog, glitch, t, full);
      }
      const progress = clamp((idx + (this.finalCutsceneTimer > 0 ? 0.18 : 0)) / sequence.length, 0, 1);
      const barW = panelW - 66;
      const barX = panelX + 33;
      const barY = panelY + panelH - 44;
      if (!isBlackBeat) {
        ctx.strokeStyle = "rgba(0,255,220,0.52)";
        ctx.strokeRect(barX, barY, barW, 9);
        ctx.fillStyle = "rgba(0,255,220,0.44)";
        ctx.fillRect(barX + 1, barY + 1, (barW - 2) * progress, 7);
      }
      const hintA = 0.62 + Math.sin(this.finalCutsceneSkipHintPulse) * 0.28;
      ctx.fillStyle = "rgba(184,238,252," + hintA.toFixed(3) + ")";
      ctx.font = "12px monospace";
      ctx.fillText("Press Space, Enter, Esc, R, or click to skip", VIEW_W / 2, VIEW_H - 52);
    },
    drawFail() {
      const u = VisualJuice.uiT;
      ctx.fillStyle="rgba(45,8,12,0.94)"; ctx.fillRect(100,120,VIEW_W-200,VIEW_H-240);
      ctx.strokeStyle="rgba(255,60,80,"+(0.55+Math.sin(u*4)*0.15)+")"; ctx.lineWidth=2;
      ctx.shadowColor="rgba(255,40,60,0.35)"; ctx.shadowBlur=18;
      ctx.strokeRect(100,120,VIEW_W-200,VIEW_H-240); ctx.shadowBlur=0;
      ctx.fillStyle="#f88"; ctx.font="bold 26px monospace"; ctx.textAlign="center";
      ctx.shadowColor="rgba(255,80,100,0.45)"; ctx.shadowBlur=12;
      ctx.fillText("SIGNAL LOST", VIEW_W/2, 220);
      ctx.shadowBlur=0;
      ctx.fillStyle="#dcb"; ctx.font="14px monospace"; ctx.fillText("Exposure maxed. Mission restart.", VIEW_W/2, 280);
      ctx.fillStyle="#987"; ctx.font="12px monospace"; ctx.fillText("Press R or click anywhere — retry", VIEW_W/2, 320);
      ctx.fillStyle="rgba(80,30,30,0.95)"; ctx.fillRect(VIEW_W/2-140,350,280,42); ctx.strokeStyle="#f66"; ctx.strokeRect(VIEW_W/2-140,350,280,42);
      ctx.fillStyle="#fcc"; ctx.font="bold 14px monospace"; ctx.fillText("RETRY", VIEW_W/2, 376);
    },
  };

  const NetworkLayer = {
    isAuthoritativeHost: () => NetworkCoordinator.isAuthoritativeHost(),
    sendInputFrame: (payload) => NetworkCoordinator.sendInputFrame(payload),
    sendMissionAction: (payload, slot) => NetworkCoordinator.sendMissionAction(payload, slot),
    applySnapshot: (world, byId, snap) => NetProtocol.applySnapshotV1(world, byId, snap)
  };

  window.NeuralHeistNet = {
    Net,
    NetProtocol,
    NetworkCoordinator,
    NetworkLayer,
    AuthoritativeSession,
    SimulationRunner,
    GameEngine,
    DetectionSystem,
    MissionSystem,
    ObjectiveEngine,
    ProgressionController,
    AISystem,
    HackEngine,
    NpcRoleSystem,
    NpcFavorSystem,
    NpcBonusSystem,
    ServerAuthorityFactory,
    ServerAuthority,
    LocalRoomService
  };

  const _nhHeadless = typeof globalThis !== "undefined" && globalThis.__NEURAL_HEIST_HEADLESS_SERVER__;

  function __nhApplyRemoteMissionAction(slot, payload) {
    if (!AuthoritativeSession.players || !AuthoritativeSession.players.length) return;
    const w = GameStateManager.world;
    if (!w) return;
    const pl = AuthoritativeSession.players[slot | 0];
    if (!pl) return;
    const prevSlot = GameStateManager.localPlayerId | 0;
    GameStateManager.localPlayerId = slot | 0;
    GameStateManager.player = pl;
    try {
      const k = payload && payload.kind;
      const allowed = {
        fake_task: 1, sabotage: 1, investigate: 1, report: 1,
        interact: 1, hack_click: 1, hack_trace: 1
      };
      if (!allowed[k]) return;
      if (k === "fake_task") GameStateManager.tryFakeTask();
      else if (k === "sabotage") GameStateManager.trySabotage();
      else if (k === "investigate") GameStateManager.tryInvestigate();
      else if (k === "report") GameStateManager.tryReportSuspicion();
      else if (k === "interact") GameStateManager.tryInteract();
      else if (k === "hack_click" && payload.mx != null && payload.my != null) {
        GameStateManager.handleHackPointer(payload.mx, payload.my, 1);
      } else if (k === "hack_trace") {
        const hk = GameStateManager.hack;
        if (!hk || !hk.isTraceStage()) return;
        const ph = payload && payload.phase;
        if (ph === "down" && payload.mx != null && payload.my != null) {
          hk.onTracePointerDown(payload.mx, payload.my, payload.ps != null ? payload.ps : 0);
        } else if (ph === "up") {
          hk.onTracePointerUp();
        } else if (ph === "move" && payload.mx != null && payload.my != null && hk.tracePointerDown) {
          hk._traceApplyPointer(payload.mx, payload.my);
        }
      }
    } finally {
      // Action side effects (relay completion / terminal state / objectives) are broadcast by authority immediately.
      if (NetworkCoordinator.isAuthoritativeHost && NetworkCoordinator.isAuthoritativeHost() && GameStateManager.world) {
        AuthoritativeSession.broadcastSnapshot(GameStateManager.world);
      }
      GameStateManager.localPlayerId = prevSlot;
      GameStateManager.player = GameStateManager._resolveLocalPlayer(AuthoritativeSession.players);
    }
  }

  function __nhBootstrapDedicatedRoom(opts) {
    opts = opts || {};
    const mid = opts.missionId | 0;
    const sc = clamp(opts.slotCount | 0, MULTI_MIN_SLOTS, MULTI_MAX_SLOTS);
    const onSnapshot = opts.onSnapshot;
    if (typeof globalThis !== "undefined") globalThis.NEURAL_HEIST_SLOTS = sc;
    GameStateManager.gameMode = "online_mock";
    GameStateManager.localRoom = null;
    GameStateManager.roomCode = "";
    GameStateManager.phase = "playing";
    GameStateManager.mode = "play";
    GameStateManager.currentState = STATES.CAMPAIGN;
    GameStateManager.paused = false;
    AuthoritativeSession.transport = {
      __dedicatedWs: true,
      emit(ev, payload) {
        if (ev === Net.Msg.SNAPSHOT && typeof onSnapshot === "function") onSnapshot(payload);
      }
    };
    GameStateManager.startMission(mid > 0 ? mid : 1);
    return true;
  }

  function __nhServerTick(dt) {
    const d = Math.max(1 / 240, Math.min(0.08, dt));
    GameStateManager._lastDt = d;
    if (GameStateManager.flushPendingState) GameStateManager.flushPendingState();
    if (GameStateManager.processEventQueue) GameStateManager.processEventQueue();
    GameStateManager.syncStateFromPhase();
    GameStateManager.update(d);
  }

  let lastTime = performance.now();
  let dbgLastFrameAt = performance.now();
  let dbgFrameCount = 0;
  let dbgLastStateSnapshot = "";
  let dbgLoopStallWarned = false;
  function resetClock() {
    lastTime = performance.now();
  }
  function forceExitHacking() {
    gameState = "PLAYING";
    resetClock();
    activeHackingSession = null;
    if (GameStateManager) {
      GameStateManager.mode = "play";
    }
    InputManager.exitHackingMode();
    canvas.style.cursor = "crosshair";
    canvas.style.pointerEvents = "auto";
  }

  if (_nhHeadless) {
    globalThis.__NeuralHeistServerRuntime__ = {
      bootstrapDedicatedRoom: __nhBootstrapDedicatedRoom,
      serverTick: __nhServerTick,
      applyRemoteMissionAction: __nhApplyRemoteMissionAction,
      Net,
      GameStateManager,
      AuthoritativeSession,
      NetworkCoordinator,
      STATES
    };
  } else {
    GameStateManager.initInput();
    GameStateManager._setHint("WASD · Q talk (1/2/3 choose) · hack relays then extract", "#8fefff", 4.0);

    function frame(now) {
      const dt = Math.min(0.05, (now-lastTime)/1000);
      lastTime = now;
      dbgLastFrameAt = now;
      dbgFrameCount++;
      GameStateManager._lastDt = dt;
      GameStateManager.flushPendingState();
      if (GameStateManager.processEventQueue) GameStateManager.processEventQueue();
      if (GameStateManager.ensurePostHackStateHealth && now >= (GameStateManager._nextPostHackHealthAt || 0)) {
        GameStateManager._nextPostHackHealthAt = now + 120;
        GameStateManager.ensurePostHackStateHealth(now);
      }
      if (GameStateManager.validateRuntimeState && now >= (GameStateManager._nextRuntimeValidateAt || 0)) {
        GameStateManager._nextRuntimeValidateAt = now + 90;
        GameStateManager.validateRuntimeState(now);
      }
      GameStateManager.syncStateFromPhase();
      const stateSnap = GameStateManager.phase + "|" + GameStateManager.mode + "|" + GameStateManager.currentState;
      if (stateSnap !== dbgLastStateSnapshot) {
        dbgLastStateSnapshot = stateSnap;
        if (GameStateManager._dbgLog) GameStateManager._dbgLog("frame state transition", { frame: dbgFrameCount, dt: +dt.toFixed(4), phase: GameStateManager.phase, mode: GameStateManager.mode, currentState: GameStateManager.currentState });
        if (GameStateManager.mode === "play" && GameStateManager._dbgWatchEnd) GameStateManager._dbgWatchEnd("endHacking->campaign-loop");
      }
      if ((dbgFrameCount % 180) === 0 && GameStateManager._dbgLog) {
        GameStateManager._dbgLog("frame heartbeat", {
          frame: dbgFrameCount,
          dt: +dt.toFixed(4),
          phase: GameStateManager.phase,
          mode: GameStateManager.mode,
          currentState: GameStateManager.currentState
        });
      }
      switch (GameStateManager.currentState) {
        case STATES.CAMPAIGN:
        case STATES.HACKING:
          GameStateManager.update(dt);
          break;
        case STATES.GAMEOVER:
        case STATES.MENU:
        case STATES.MULTIPLAYER_LOBBY:
          GameStateManager.updateMeta(dt);
          break;
        default:
          break;
      }
      GameStateManager.render(dt);
      requestAnimationFrame(frame);
    }
    setInterval(() => {
      const elapsed = performance.now() - dbgLastFrameAt;
      if (elapsed > 1200) {
        if (!dbgLoopStallWarned) {
          dbgLoopStallWarned = true;
          if (GameStateManager && GameStateManager._dbgLog) {
            GameStateManager._dbgLog("FRAME LOOP STALL DETECTED", {
              elapsedMs: +elapsed.toFixed(1),
              phase: GameStateManager.phase,
              mode: GameStateManager.mode,
              currentState: GameStateManager.currentState
            });
          }
        }
      } else {
        dbgLoopStallWarned = false;
      }
    }, 500);
    requestAnimationFrame(frame);
  }
})();
