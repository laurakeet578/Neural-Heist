        if (!ex) {
          this.npcFavor = null;
          return;
        }
        const inZ = p.x >= ex.x - 18 && p.x <= ex.x + ex.w + 18 && p.y >= ex.y - 18 && p.y <= ex.y + ex.h + 18;
        if (inZ && spd < 0.34) f.hold = (f.hold || 0) + dt;
        else f.hold = Math.max(0, (f.hold || 0) - dt * 0.55);
        if (f.hold >= (f.needHold || 1.55)) this._completeNpcFavor();
      } else if (f.type === "visit_marker") {
        const d = Math.hypot(p.x - (f.tx || 0), p.y - (f.ty || 0));
        if (d < (f.needNear || 76) && spd < 0.42) f.hold = (f.hold || 0) + dt;
        else f.hold = Math.max(0, (f.hold || 0) - dt * 0.9);
        if (f.hold >= (f.holdSec || 1.2)) this._completeNpcFavor();
      }
    },
    _resolveNpcChoice(npc, choiceId) {
      const choice = (this.npcDialogueChoices || []).find(c => c.id === choiceId);
      const out = NpcDialogueEngine.resolveReply(npc, choice || { category: "neutral", text: "" });
      return { speaker: (npc.cpuName || this.npcDialogueSpeaker || "CPU"), text: out.text, suspiciousDelta: out.suspiciousDelta };
    },
    selectNpcDialogueChoice(choiceId) {
      if (!this.npcDialogueAwaitingChoice || !this.npcDialogueNPC) return;
      if (performance.now() >= (this.npcDialogueUntil || 0)) {
        this.npcDialogueAwaitingChoice = false;
        this.npcDialogueChoices = [];
        this.npcDialogueNPC = null;
        return;
      }
      const npc = this.npcDialogueNPC;
      const choiceObj = (this.npcDialogueChoices || []).find(c => c.id === choiceId);
      if (choiceObj && choiceObj.meta === "npc_favor") {
        const spec = this._favorChoiceSpecById && this._favorChoiceSpecById[choiceId];
        if (spec && !this.npcFavor) {
          this._showNPCDialogue(npc.cpuName || "CPU", "Solid — quick and quiet.", 2600);
          SFX.play("npc_talk");
          this._startNpcFavor(spec, npc);
          npc._favorOfferCd = performance.now() + 70000;
        } else {
          this._showNPCDialogue(npc.cpuName || "CPU", "Another time — I cannot run that favor right now.", 2200);
          SFX.play("npc_talk");
        }
        if (this._favorChoiceSpecById) delete this._favorChoiceSpecById[choiceId];
        this.npcDialogueAwaitingChoice = false;
        this.npcDialogueChoices = [];
        this.npcDialogueNPC = null;
        return;
      }
      const out = this._resolveNpcChoice(npc, choiceId);
      this._showNPCDialogue(out.speaker, out.text, 3200);
      SFX.play("npc_talk");
      if (this.player && typeof out.suspiciousDelta === "number" && !Number.isNaN(out.suspiciousDelta)) {
        this.player.suspicion = clamp((this.player.suspicion || 0) + out.suspiciousDelta, 0, 100);
      }
      const gRole = npc.npcGameplayRole || NpcRoleSystem.computeRole(npc);
      if (gRole === "helpful" && choiceObj) {
        const cat = choiceObj.category;
        if (cat === "friendly" || cat === "casual" || cat === "neutral") {
          this.player.suspicion = clamp((this.player.suspicion || 0) - 1.6, 0, 100);
        }
      }
      if (choiceObj && this.world) {
        NpcBonusSystem.tryGrantFromPositiveChat(this.world, this, npc, choiceObj);
      }
      if (gRole === "hostile" && choiceObj && (choiceObj.category === "aggressive" || choiceObj.category === "suspicious") && this.world) {
        this.world.alarm = clamp((this.world.alarm || 0) + 2.4, 0, 100);
        this.world.exposure = clamp((this.world.exposure || 0) + 1.4, 0, 100);
        npc._hostileDialogPrimedUntil = performance.now() + 11000;
      }
      if (choiceObj && choiceObj.meta === "worker_intel" && npc.npcKind === "worker") {
        this._assignWorkerTask();
      }
    },
    _assignWorkerTask() {
      if (this.npcTask && !this.npcTask.done) return false;
      this.npcTask = {
        id: "worker-low-profile",
        type: "low_profile",
        label: "Stay under 50 suspicion for 20s",
        progressSec: 0,
        targetSec: 20,
        done: false,
        reward: "stealth_buffer"
      };
      return true;
    },
    _grantNpcTaskReward(task) {
      const w = this.world;
      if (!w || !task || task._rewarded) return;
      task._rewarded = true;
      w.flags.hackSpeedBonus = Math.max(w.flags.hackSpeedBonus || 0, 0.1);
      w.alarm = Math.max(0, (w.alarm || 0) - 6);
      if (this.player) this.player.suspicion = Math.max(0, (this.player.suspicion || 0) - 10);
      w.flags.uiBonusCount = (w.flags.uiBonusCount || 0) + 1;
      this._showNPCDialogue("Worker", "Nice. Trace pressure dropped, and your breach rig runs faster.", 3200);
    },
    _npcDialogueFor(npc) {
      const w = this.world, p = this.player;
      const kind = npc.npcKind || "worker";
      const lore = STORY_BEATS[(w && w.def && w.def.id) || 0] || [];
      const loreLine = lore.length ? lore[((w.flags.loreIndex || 0) % lore.length)] : "";
      if (kind === "informant") {
        const terminals = (w && w.terminals) ? w.terminals.filter(t => t.kind === "primary" && !TerminalState.isCompleted(t) && !w.hackedTerminals[t.id]) : [];
        const relayHint = terminals.length ? ("Next live relay: " + terminals[0].label + ".") : "No live relays left. Move to extraction.";
        const guardHint = (w && w.guards && w.guards.length > 4)
          ? "Heavy patrol overlap in central lanes."
          : "Two patrol arcs cross near the core corridors.";
        return { speaker: "Informant", text: relayHint + " " + guardHint + (loreLine ? (" " + loreLine) : ""), suspiciousDelta: 0 };
      }
      if (kind === "suspicious") {
        const sp = p ? (p.suspicion || 0) : 0;
        if (sp > 65) return { speaker: "Suspicious Tech", text: "You look wrong for this sector. Keep moving.", suspiciousDelta: 5.5 };
        if (sp > 38) return { speaker: "Suspicious Tech", text: "Security is tracking behavior spikes. Stay calm.", suspiciousDelta: 2.5 };
        return { speaker: "Suspicious Tech", text: "Badge checks are tightening around relay rooms.", suspiciousDelta: 1.0 };
      }
      // Worker
      if (!this.npcTask || this.npcTask.done) {
        const assigned = this._assignWorkerTask();
        if (assigned) return { speaker: "Worker", text: "Side job: keep suspicion under 50 for 20 seconds. I can scrub your trace after.", suspiciousDelta: 0 };
      }
      return { speaker: "Worker", text: "Keep your head down. Stay below 50 suspicion to finish the side task.", suspiciousDelta: 0 };
    },
    tryTalkToNPC() {
      if (this.phase !== "playing" || this.mode !== "play" || this.paused || !this.world || !this.player) return;
      SFX.ensure();
      const nearest = this._nearestTalkNpc();
      if (!nearest || !nearest.npc) {
        this._showNPCDialogue("System", "No one close enough to talk. Move closer to an NPC.", 1800);
        return;
      }
      const npc = nearest.npc;
      const now = performance.now();
      if (npc.dialogueCooldownUntil && now < npc.dialogueCooldownUntil) return;
      npc.dialogueCooldownUntil = now + 1300;
      this._openNpcChoiceDialogue(npc);
      SFX.play("npc_talk");
    },
    _updateNpcTask(dt) {
      const t = this.npcTask, p = this.player;
      if (!t || t.done || !p || this.phase !== "playing" || this.mode !== "play") return;
      if (t.type === "low_profile") {
        if ((p.suspicion || 0) <= 50) t.progressSec = Math.min(t.targetSec, t.progressSec + dt);
        else t.progressSec = Math.max(0, t.progressSec - dt * 0.5);
        if (t.progressSec >= t.targetSec) {
          t.done = true;
          this._grantNpcTaskReward(t);
        }
      }
    },

    initInput() {
      if (!this.hackingSession) this.hackingSession = new HackingSession(this.hack);
      InputManager.install(this);
    },
    /** ACTION line: trimmed script token starts with "[" and ends with "]" — never dialogue HUD text. */
    _cutsceneIsActionLine(line) {
      const s = String(line || "").trim();
      return s.length >= 2 && s[0] === "[" && s[s.length - 1] === "]";
    },
    /** DIALOGUE only: empty for action lines (typewriter / HUD must never receive bracket directions). */
    _cutsceneDialogueText(line) {
      return this._cutsceneIsActionLine(line) ? "" : String(line || "");
    },
    /** Run non-draw side effects for the current action line (SFX; extend for camera, etc.). */
    _cutsceneExecuteActionLine(phaseId, lineIndex, rawLine) {
      if (!this._cutsceneIsActionLine(rawLine)) return;
      this._cutsceneDispatchActionSfx(phaseId, lineIndex, rawLine);
    },
    /**
     * Storyboard beats: each shot spans dialogue line indices [line0, line1] inclusive.
     * Every cutscene is intentionally sequenced as subject + action per shot.
     */
    _cutsceneStoryboardShots(phase) {
      const T = {
        intro_cutscene: [
          { subject: "Arcology & relay grid", action: "Night lights pulse across the sector", line0: 0, line1: 0 },
          { subject: "Security cameras", action: "Guards move on live patrol routes", line0: 1, line1: 1 },
          { subject: "Agent Nyx", action: "Holds in shadow at the infiltration point", line0: 2, line1: 3 },
          { subject: "Agent Nyx", action: "Walks the route toward extraction", line0: 4, line1: 5 }
        ],
        post_level1_cutscene: [
          { subject: "Handler uplink", action: "Confirms you crossed the outer seal", line0: 0, line1: 1 },
          { subject: "The facility grid", action: "Glitches — breach felt too clean", line0: 2, line1: 2 },
          { subject: "Agent Nyx", action: "Acknowledges — stay sharp", line0: 3, line1: 3 }
        ],
        post_level2_cutscene: [
          { subject: "Mission tempo", action: "Ops warns you are ahead of projections", line0: 0, line1: 1 },
          { subject: "Neural Grid", action: "Corruption spike on the line", line0: 2, line1: 2 },
          { subject: "The system", action: "Reacts — tracking your rhythm", line0: 3, line1: 3 }
        ],
        post_level3_cutscene: [
          { subject: "Operator instinct", action: "Something in the pattern is wrong", line0: 0, line1: 1 },
          { subject: "Heuristic model", action: "Anticipates movement before you commit", line0: 2, line1: 2 },
          { subject: "Surveillance uplink", action: "Static hit — then push forward", line0: 3, line1: 4 }
        ],
        post_level4_cutscene: [
          { subject: "Security stack", action: "Layers shift after your trigger", line0: 0, line1: 1 },
          { subject: "Alarm core", action: "Glitch burst — manual override implied", line0: 2, line1: 2 },
          { subject: "Unknown observer", action: "Locks eyes on your corridor", line0: 3, line1: 4 }
        ],
        post_level5_cutscene: [
          { subject: "Handler", action: "Delivers a final warning", line0: 0, line1: 2 },
          { subject: "The Grid", action: "Adapts — glitches under pressure", line0: 3, line1: 5 },
          { subject: "Agent Nyx", action: "Faces cost — it will remember you", line0: 6, line1: 6 }
        ],
        final_cutscene: [
          { subject: "Facility & alarms", action: "Core destabilizes — your ID burns in", line0: 0, line1: 4 },
          { subject: "Antagonist voice", action: "Finds you on the wire", line0: 5, line1: 7 },
          { subject: "The truth", action: "Blackout — you were always inside", line0: 8, line1: 11 },
          { subject: "Neural Grid", action: "Feed dies — connection held open", line0: 12, line1: 14 }
        ]
      };
      return T[phase] || [];
    },
    _cutsceneStoryboardForLine(phase, lineIndex) {
      const shots = this._cutsceneStoryboardShots(phase);
      const li = lineIndex | 0;
      for (let i = 0; i < shots.length; i++) {
        const s = shots[i];
        if (li >= s.line0 && li <= s.line1) {
          return { shot: i + 1, total: shots.length, subject: s.subject, action: s.action };
        }
      }
      return { shot: 1, total: Math.max(1, shots.length), subject: "", action: "" };
    },
    _drawCutsceneStoryboardHud(ctx, phase, lineIndex, topY) {
      const sb = this._cutsceneStoryboardForLine(phase, lineIndex);
      if (!sb.subject && !sb.action) return;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const pad = 16;
      const w = VIEW_W - pad * 2;
      const y = topY;
      ctx.fillStyle = "rgba(2, 10, 18, 0.82)";
      ctx.fillRect(pad, y, w, 50);
      ctx.strokeStyle = "rgba(0, 255, 220, 0.42)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(pad, y, w, 50);
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(160, 255, 245, 0.95)";
      ctx.font = "bold 11px monospace";
      ctx.fillText("SHOT " + sb.shot + " / " + sb.total, pad + 10, y + 18);
      ctx.fillStyle = "rgba(210, 240, 255, 0.9)";
      ctx.font = "11px monospace";
      const sub = String(sb.subject || "").toUpperCase();
      const act = String(sb.action || "");
      const one = (sub + " — " + act).slice(0, 102);
      ctx.fillText(one, pad + 10, y + 38);
      ctx.restore();
    },
    _introSceneFromLineIndex(idx) {
      const sb = this._cutsceneStoryboardForLine("intro_cutscene", idx);
      const map = ["city", "cctv", "nyx", "deploy"];
      return map[Math.min(sb.shot, map.length) - 1] || "city";
    },
    _easeOutCubic(p) {
      const x = clamp(p, 0, 1);
      return 1 - Math.pow(1 - x, 3);
    },
    /** Deterministic “snow” inside a surveillance monitor bezel (no random particle field). */
    _cutsceneDrawMonitorFeedNoise(ctx, mx, my, mw, mh, t, steps) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();
      const ft = (t * 36) | 0;
      for (let k = 0; k < steps; k++) {
        const px = mx + 2 + ((k * 83 + ft * 11) % (mw - 4));
        const py = my + 2 + ((k * 59 + ft * 7) % (mh - 4));
        ctx.fillStyle = (k % 2) ? "rgba(255,255,255,0.11)" : "rgba(0,255,230,0.07)";
        ctx.fillRect(px, py, 2, 2);
      }
      ctx.restore();
      ctx.strokeStyle = "rgba(115,250,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mx, my, mw, mh);
    },
    /** Guard NPC: pose idle | walk | run | alert — each reads as a deliberate body action. */
    _cutsceneDrawGuardSilhouette(ctx, gx, gy, t, gid, pose) {
      const p = pose || "idle";
      const spd = p === "run" ? 2.8 : p === "walk" ? 1.15 : 1;
      const bob = Math.sin(t * 1.65 * spd + gid * 1.7) * (p === "run" ? 3.2 : 2);
      const stride = p === "walk" ? Math.sin(t * 5.5 + gid * 1.2) * 3.5 : (p === "run" ? Math.sin(t * 11 + gid) * 5.5 : 0);
      const lean = p === "run" ? 0.11 : 0;
      ctx.save();
      ctx.translate(gx, gy + bob);
      ctx.rotate(lean);
      ctx.translate(stride * 0.15, 0);
      ctx.fillStyle = p === "alert" ? "rgba(28,18,22,0.98)" : "rgba(18,34,48,0.98)";
      ctx.fillRect(-7, -20, 14, 24);
      const legA = p === "idle" ? 0 : Math.sin(t * (p === "run" ? 12.5 : 6.2) + gid) * (p === "run" ? 2.8 : 1.6);
      const legB = -legA;
      ctx.fillRect(-6 + legA, 4, 5, 13);
      ctx.fillRect(1 + legB, 4, 5, 13);
      ctx.fillStyle = "rgba(120,250,255,0.55)";
      ctx.fillRect(-3, -28, 6, 2);
      if (p === "alert") {
        ctx.fillStyle = "rgba(255,90,110,0.75)";
        ctx.beginPath();
        ctx.moveTo(10, -24);
        ctx.lineTo(22, -20);
        ctx.lineTo(10, -16);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    },
    /** Access terminal: chassis, scan line, optional operator typing cursor (subject + action). */
    _cutsceneDrawTerminalBezel(ctx, x, y, w, h, t, tid, opts) {
      const o = opts || {};
      const typing = !!o.typing;
      ctx.fillStyle = "rgba(16,30,42,0.96)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(90,240,255,0.48)";
      ctx.strokeRect(x, y, w, h);
      const scanY = y + 14 + ((t * 72 + tid * 40) % (h - 36));
      ctx.fillStyle = "rgba(0,255,235,0.2)";
      ctx.fillRect(x + 10, scanY, w - 20, 9);
      ctx.fillStyle = "rgba(0,255,235,0.08)";
      ctx.fillRect(x + 10, y + 14, w - 20, h - 28);
      if (typing) {
        const rowY = y + h - 22;
        ctx.fillStyle = "rgba(180,255,245,0.9)";
        const cx = x + 16 + ((t * 38 + tid * 17) % Math.max(12, w - 52));
        ctx.fillRect(cx, rowY, 5 + (tid % 3) * 2, 2);
        if ((((t * 6) | 0) + tid) % 2 === 0) {
          ctx.fillStyle = "rgba(0,255,220,0.85)";
          ctx.fillRect(cx + 8, rowY - 10, 2, 10);
        }
      }
    },
    /** Ceiling-mounted CCTV: housing + lens + sweeping pan (subject: camera — action: scanning). */
    _cutsceneDrawCeilingCamera(ctx, cx, cy, t, sweepWide) {
      ctx.fillStyle = "rgba(30,42,58,0.95)";
      ctx.beginPath();
      ctx.ellipse(cx, cy, 18, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(130,245,255,0.45)";
      ctx.stroke();
      ctx.fillStyle = "rgba(8,14,22,0.92)";
      ctx.beginPath();
      ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2);
      ctx.fill();
      const ang = Math.sin(t * 1.4) * (sweepWide ? 0.55 : 0.35);
      ctx.save();
      ctx.translate(cx, cy + 2);
      ctx.rotate(ang);
      ctx.fillStyle = "rgba(0,255,220,0.12)";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(140, 28);
      ctx.lineTo(140, -28);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(120,250,255,0.22)";
      ctx.stroke();
      ctx.restore();
    },
    /** Surveillance monitor: clipped feed showing a guard walking a hallway (subject + action). */
    _cutsceneDrawMonitorGuardWalkFeed(ctx, mx, my, mw, mh, t, seed) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();
      ctx.fillStyle = "rgba(6,12,20,0.98)";
      ctx.fillRect(mx, my, mw, mh);
      ctx.fillStyle = "rgba(14,28,44,0.9)";
      ctx.fillRect(mx, my + mh * 0.55, mw, mh * 0.45);
      ctx.strokeStyle = "rgba(60,110,140,0.35)";
      ctx.beginPath();
      ctx.moveTo(mx + 8, my + mh * 0.55);
      ctx.lineTo(mx + mw - 8, my + mh * 0.55);
      ctx.stroke();
      const gx = mx + 12 + ((t * 42 + seed * 61) % (mw - 36));
      const gy = my + mh * 0.62;
      this._cutsceneDrawGuardSilhouette(ctx, gx, gy, t, seed % 5, "walk");
      const scanY = my + 10 + ((t * 55 + seed) % (mh * 0.4));
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(mx + 4, scanY, mw - 8, 2);
      ctx.restore();
      ctx.strokeStyle = "rgba(115,250,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mx, my, mw, mh);
    },
    /** Mini overhead map: dashed patrol path + guard dot moving along it. */
    _cutsceneDrawMiniPatrolMap(ctx, mx, my, mw, mh, t, seed) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();
      ctx.fillStyle = "rgba(8,16,26,0.96)";
      ctx.fillRect(mx, my, mw, mh);
      const p0x = mx + 18, p0y = my + mh - 22;
      const p1x = mx + mw * 0.55, p1y = my + 28;
      const p2x = mx + mw - 22, p2y = my + mh * 0.45;
      ctx.strokeStyle = "rgba(255,140,200,0.4)";
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p0x, p0y);
      ctx.lineTo(p1x, p1y);
      ctx.lineTo(p2x, p2y);
      ctx.stroke();
      ctx.setLineDash([]);
      const u = (t * 0.22 + seed * 0.37) % 1;
      let qx, qy;
      if (u < 0.45) {
        const k = u / 0.45;
        qx = p0x + (p1x - p0x) * k;
        qy = p0y + (p1y - p0y) * k;
      } else if (u < 0.85) {
        const k = (u - 0.45) / 0.4;
        qx = p1x + (p2x - p1x) * k;
        qy = p1y + (p2y - p1y) * k;
      } else {
        const k = (u - 0.85) / 0.15;
        qx = p2x + (p0x - p2x) * k;
        qy = p2y + (p0y - p2y) * k;
      }
      ctx.fillStyle = "rgba(255,200,120,0.95)";
      ctx.beginPath();
      ctx.arc(qx, qy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "rgba(100,240,255,0.38)";
      ctx.lineWidth = 1;
      ctx.strokeRect(mx, my, mw, mh);
    },
    _cutsceneDrawCorridorInterior(ctx, t, e) {
      ctx.fillStyle = "rgba(5,11,20,0.94)";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.fillStyle = "rgba(12,22,36,0.92)";
      ctx.beginPath();
      ctx.moveTo(0, VIEW_H * 0.74);
      ctx.lineTo(VIEW_W * 0.5, VIEW_H * 0.4);
      ctx.lineTo(VIEW_W, VIEW_H * 0.74);
      ctx.lineTo(VIEW_W, VIEW_H);
      ctx.lineTo(0, VIEW_H);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(8,16,28,0.95)";
      ctx.fillRect(0, 0, VIEW_W * 0.2, VIEW_H);
      ctx.fillRect(VIEW_W * 0.8, 0, VIEW_W * 0.2, VIEW_H);
      for (let L = 0; L < 8; L++) {
        const cx = VIEW_W * 0.24 + L * (VIEW_W * 0.52 / 7);
        const lit = 0.45 + 0.55 * Math.sin(t * 7.5 + L * 0.85);
        ctx.fillStyle = "rgba(120,248,255," + (0.12 * lit * (0.5 + 0.5 * e)).toFixed(3) + ")";
        ctx.fillRect(cx - 18, VIEW_H * 0.18, 36, 7);
      }
    },
    _cutsceneDrawCitySkylineGrounded(ctx, t, e, drift) {
      ctx.fillStyle = "rgba(2,6,14,0.96)";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H * 0.42);
      ctx.fillStyle = "rgba(8,18,32,0.9)";
      ctx.beginPath();
      ctx.moveTo(0, VIEW_H * 0.62);
      ctx.lineTo(VIEW_W, VIEW_H * 0.62);
      ctx.lineTo(VIEW_W, VIEW_H);
      ctx.lineTo(0, VIEW_H);
      ctx.closePath();
      ctx.fill();
      for (let i = 0; i < 24; i++) {

    /** Map bracketed stage direction to a visual cue id (never shown as text). */
    _parseCutsceneCue(text) {
      const raw = String(text || "").trim();

      const s = raw.toUpperCase();
      if (s.includes("BLACK SCREEN")) return "black_screen";
      if (s.includes("FADE OUT")) return "fade_out";
      if (s.includes("FADE IN")) return "fade_in";
      if (s.includes("FINAL GLITCH")) return "final_glitch";
      if (s.includes("STATIC")) return "static";
      if (s.includes("GLITCH") && (s.includes("ID") || s.includes("PLAYER"))) return "glitch_id";
      if (s.includes("GLITCH")) return "glitch";
      if (s.includes("FLASH") && (s.includes("CITY") || s.includes("LIGHT"))) return "flash_city";
      if (s.includes("CITY") && (s.includes("LIGHT") || s.includes("FLICKER"))) return "city_lights";
      if (s.includes("FLASH") && (s.includes("GUARD") || s.includes("TERMINAL") || s.includes("SURVEILLANCE"))) return "flash_montage";
      if (s.includes("ALARM")) return "alarms";
      if (s.includes("CAMERA") && s.includes("PAN")) return "camera_pan";

    syncStateFromPhase() {

      else if (this.phase === "intro_cutscene") this.currentState = STATES.MENU;
      else if (this.phase === "post_level1_cutscene") this.currentState = STATES.GAMEOVER;
      else if (this.phase === "post_level2_cutscene") this.currentState = STATES.GAMEOVER;
      else if (this.phase === "post_level3_cutscene") this.currentState = STATES.GAMEOVER;
      else if (this.phase === "post_level4_cutscene") this.currentState = STATES.GAMEOVER;
      else if (this.phase === "post_level5_cutscene") this.currentState = STATES.GAMEOVER;

      this._dbgLog("setPhase() applied", { phase: this.phase, mode: this.mode, currentState: this.currentState });

        this.mode = "play";
        this.phase = "playing";

    updateMeta(dt) {

            if (NetworkCoordinator.mode === "ws_client") {
              this._dbgLog("host requested: waiting for server room_create confirmation");
              this._sendWsRoomCreateRequest();
            } else {
              this.enterLobby(this.missionId || 1);
              this.localRoom = LocalRoomService.hostRoom(this.missionId || 1);
              this.roomCode = this.localRoom.roomCode;
              this.localPlayerId = 0;
              this.lobbyReady = LocalRoomService.connectedCount(this.localRoom) >= 2;
            }
          } else {
            this.enterLobby(this.missionId || 1);
          }

        const idx = this.introCutsceneLineIndex;
        if (idx >= sequence.length) {
          this.finishIntroCutscene();
          return;
        }
        const current = sequence[idx];
        if (this.world && this.world.guards) {
          for (let gi = 0; gi < this.world.guards.length; gi++) {
            this.world.guards[gi].update(dt, [], this.world, this.world.flags || {});
          }
        }
        if (this._introSceneFromLineIndex(idx) === "deploy") {

        }
        this._cutsceneHudLineDur = current.duration || 1;
        this._cutsceneHudRawLine = current.text;
        this._cutsceneExecuteActionLine("intro", idx, current.text);
        const revealRate = current.revealRate || 64;
        const displayText = this._cutsceneDialogueText(current.text);
        this.introCutsceneLineReveal = Math.min(displayText.length, this.introCutsceneLineReveal + revealRate * dt);
        this.introCutsceneFlash = Math.max(0, this.introCutsceneFlash - dt * 2.4);
        if (this.introCutsceneTimer >= current.duration) {
          this.introCutsceneLineIndex++;

      this.queueState(this.previousState === STATES.MULTIPLAYER_LOBBY ? STATES.CAMPAIGN : (this.previousState || STATES.CAMPAIGN));
      if (!success && w) {
        w.alarm = clamp(w.alarm + 21, 0, 100);
        w.exposure = clamp((w.exposure || 0) + 14, 0, 100);
        if (this.player) {
          w.flags.guardFocus = { targetId: this.player.id, until: performance.now() + 6500 };
          NetworkManager.pushAlert("hack_failed", this.player.x, this.player.y);
        }
      }
      forceExitHacking();
      this.syncStateFromPhase();
      this._dbgLog("endHacking() end", {

        pendingState: this.pendingState,
        isPaused: this.isPaused,

      });

    recoverToGameplay(reason) {
      const pendingId = this.pendingTerminal && this.pendingTerminal.id;
      this._dbgLog("recoverToGameplay()", {
        reason,
        phase: this.phase,
        mode: this.mode,
        currentState: this.currentState,
        pendingTerminal: this.pendingTerminal ? this.pendingTerminal.id : null
      });
      if (this.hackingSession) this.hackingSession.hacking = false;
      this.hack.releaseInteraction();
      this.hack._resetStageProgress();
      this.hack.exit();
      this.mode = "play";
      this.transition = 0;
      this.pendingTerminal = null;
      this._pendingHackSpec = null;
      this.paused = false;
      this.isPaused = false;
      this.hackModeEnteredAt = 0;
      this.hackExitRequestedAt = performance.now();
      this._clearTransientRuntime("recover:" + reason);
      this.phase = "playing";
      this.currentState = STATES.CAMPAIGN;
      this.queueState(STATES.CAMPAIGN);
      forceExitHacking();
      this.syncStateFromPhase();
      if (pendingId && this.world) {
        const tt = (this.world.terminals || []).find(x => x.id === pendingId);
        if (tt && tt.state === TerminalState.IN_PROGRESS) TerminalState.set(tt, TerminalState.INACTIVE);
      }
    },
    validateRuntimeState(now) {
      if (this.phase !== "playing") return;
      const inTransition = this.mode === "transition_in";
      const hackActive = this.mode === "hack" && !!(this.hackingSession && this.hackingSession.hacking && this.hack && this.hack.active);
      const taskActive = this.mode === "task" && !!(this.task && this.task.active);
      const playerControlActive = this.mode === "play" && this.currentState === STATES.CAMPAIGN && !this.paused;
      if (inTransition) return;
      if (this.mode === "task" && !taskActive) {
        this.mode = "play";
        this.pendingTerminal = null;
      }
      // Runtime contract: in gameplay phase we should either control player or actively hack.
      if (!hackActive && !playerControlActive && !taskActive) {
        this.recoverToGameplay("invalid_runtime_state");
        return;
      }
      if (this.mode === "hack" && this.hackModeEnteredAt > 0 && (now - this.hackModeEnteredAt) > this.hackMaxDurationMs) {
        this.recoverToGameplay("hack_duration_timeout");
      }
      const w = this.world;
      if (w && this.mode === "play" && this.currentState === STATES.CAMPAIGN) {
        const complete = MissionSystem.isComplete(w);
        if (complete) {
          this.missionCompleteHoldSec += this._lastDt || 0.016;
          if (this.missionCompleteHoldSec > 0.5) this.triggerWin();
        } else {
          this.missionCompleteHoldSec = 0;
        }
        const guards = w.guards || [];
        for (let i = 0; i < guards.length; i++) {
          const g = guards[i];
          if (g.aiState !== "patrol" && g.aiState !== "investigate" && g.aiState !== "chase" && g.aiState !== "search") {
            g.aiState = "patrol";
          }
          if (!Number.isFinite(g.x) || !Number.isFinite(g.y)) {
            const wp = g.waypoints && g.waypoints.length ? g.waypoints[0] : { x: 120, y: 120 };
            g.x = wp.x; g.y = wp.y; g.aiState = "patrol";
          }
        }
      }
    },
    completeMission() {
      MissionManager.completeMission(this);
    },
    handleTaskKey(code) {
      if (!this.task || !this.task.active || this.mode !== "task") return false;
      return this.task.handleKey(code);
    },
    _startTaskForTerminal(t) {
      if (!t || !this.task) return;
      TerminalState.set(t, TerminalState.IN_PROGRESS);
      this.mode = "task";
      const kind = t.kind;
      const type = kind === "repair_task" ? "repair_hold" : kind === "circuit_task" ? "circuit_align" : "timed_input";
      this.pendingTerminal = t;
      this.task.start({ type }, () => this._onTaskDone(t), () => this._onTaskFail(t));
    },
    _onTaskDone(t) {
      const w = this.world;
      this.mode = "play";
      if (!w || !t) return;
      if (t.kind === "repair_task") {
        w.alarm = Math.max(0, (w.alarm || 0) - 8);
        w.exposure = Math.max(0, (w.exposure || 0) - 6);
      } else if (t.kind === "circuit_task") {
        w.flags.hackSpeedBonus = Math.max(w.flags.hackSpeedBonus || 0, 0.12);
      } else if (t.kind === "timed_input_task") {
        if (this.player) this.player.suspicion = Math.max(0, (this.player.suspicion || 0) - 10);
      }
      w.terminals = (w.terminals || []).filter(tt => tt.id !== t.id);
      this.pendingTerminal = null;
      this._setHint("Task complete.", "#9effcf", 2.2);
      SFX.play("hack_ok");
      if (this.player) {
        MissionSystem.sync(w, this.player);
        if (MissionSystem.isComplete(w)) this.triggerWin();
      }
    },
    _onTaskFail(t) {
      const w = this.world;
      this.mode = "play";
      if (t) TerminalState.set(t, TerminalState.INACTIVE);
      if (w) {
        w.alarm = clamp((w.alarm || 0) + 8, 0, 100);
        w.exposure = clamp((w.exposure || 0) + 5, 0, 100);
      }
      this.pendingTerminal = null;
      this._setHint("Task failed. Security pressure increased.", "#ff9a84", 2.4);
      SFX.play("hack_fail");
      if (w && this.player) MissionSystem.sync(w, this.player);
    },

    handlePointer(mx, my, pointerSerial) {
      switch (this.phase) {
        case "terminal_login":
          this.tryTerminalLoginClick(mx, my);
          return;
        case "multiplayer_menu":
          this._dbgLog("pointer dispatch: multiplayer_menu", { mx, my });
          this.tryMultiplayerMenuClick(mx, my);
          return;
        case "title":
          this.tryTitleClick(mx, my);
          return;
        case "mission_select":
          this.tryMissionSelectClick(mx, my);
          return;
        case "intro_cutscene":
          this.skipIntroCutscene();
          return;
        case "post_level1_cutscene":
          this.skipPostLevel1Cutscene();
          return;
        case "post_level2_cutscene":
          this.skipPostLevel2Cutscene();
          return;
        case "post_level3_cutscene":
          this.skipPostLevel3Cutscene();
          return;
        case "post_level4_cutscene":
          this.skipPostLevel4Cutscene();
          return;
        case "post_level5_cutscene":
          this.skipPostLevel5Cutscene();
          return;
        case "lobby":
          this._dbgLog("pointer dispatch: lobby", { mx, my });
          this.tryLobbyClick(mx, my);
          return;
        default:
          break;
      }
      if (this.phase==="briefing") { if (mx>VIEW_W/2-140 && mx<VIEW_W/2+140 && my>VIEW_H*0.62 && my<VIEW_H*0.62+48) this.startPlaying(); return; }
      if (this.phase==="playing" && this.mode==="hack") {
        this.handleHackPointer(mx, my, pointerSerial);
        return;
      }
      if (this.phase==="mission_win" || this.phase==="mission_fail" || this.phase==="final_cutscene" || this.phase==="post_level1_cutscene" || this.phase==="post_level2_cutscene" || this.phase==="post_level3_cutscene" || this.phase==="post_level4_cutscene" || this.phase==="post_level5_cutscene") {
        this.advanceFromOverlay();
        return;
      }
    },
    handleHackPointer(mx, my, pointerSerial) {
      if (this.phase !== "playing" || this.mode !== "hack") return;
      if (!NetworkCoordinator.isAuthoritativeHost()) {
        if (this.hack && this.hack.isTraceStage()) {
          NetworkCoordinator.sendMissionAction({ kind: "hack_trace", phase: "down", mx, my, ps: pointerSerial }, this.localPlayerId);
        } else {
          NetworkCoordinator.sendMissionAction({ kind: "hack_click", mx, my }, this.localPlayerId);
        }
        return;
      }
      this.hack.handleClick(mx, my, pointerSerial);
    },
    tryTerminalLoginClick(mx, my) {
      if (mx > VIEW_W / 2 - 170 && mx < VIEW_W / 2 + 170) {
        if (my > 260 && my < 312) {
          this.openMultiplayerMenu("terminal_login");
          return;
        }
        if (my > 332 && my < 384) {
          SFX.play("ui_click");
          this.gameMode = "campaign";
          NetworkCoordinator.closeCloudWebSocket();
          NetworkCoordinator.closeLocalChannel();
          this._leaveLocalRoom("terminal_login_campaign");
          this.multiplayerDedicatedUrl = "";
          if (typeof window !== "undefined") window.NEURAL_HEIST_WS = "";
          this.unlocked = loadUnlock();
          this.setPhase("mission_select");
        }
      }
    },

      if (!NetworkCoordinator.ws || NetworkCoordinator.ws.readyState !== 1) {
        this._setHint("Not connected to server.", "#ffb08a", 2.4);
        return;
      }
      const payload = { v: Net.PROTOCOL_VERSION, type: Net.Msg.ROOM_CREATE };
      this._dbgLog("sending room create request", payload);
      try {
        NetworkCoordinator.ws.send(JSON.stringify(payload));
      } catch (e) {
        this._dbgLog("room create send failed", { error: String(e && e.message ? e.message : e) });
        this._setHint("Failed to request room creation.", "#ffb08a", 2.8);

    _sendWsRoomJoinRequest(code) {
      const roomCode = String(code || "").trim().toUpperCase();
      if (!roomCode) {
        this._setHint("Enter a room code first.", "#ffb08a", 2.4);
        return;
      }
      if (!NetworkCoordinator.ws || NetworkCoordinator.ws.readyState !== 1) {
        this._setHint("Not connected to server.", "#ffb08a", 2.4);
        return;
      }
      const payload = { v: Net.PROTOCOL_VERSION, type: Net.Msg.ROOM_JOIN, roomCode };
      this._dbgLog("sending room join request", payload);
      try {
        NetworkCoordinator.ws.send(JSON.stringify(payload));
      } catch (e) {
        this._dbgLog("room join send failed", { error: String(e && e.message ? e.message : e), payload });
        this._setHint("Failed to send join request.", "#ffb08a", 2.8);
      }
    },
    _sendWsStartMatchRequest() {
      if (!NetworkCoordinator.ws || NetworkCoordinator.ws.readyState !== 1) {
        this._setHint("Not connected to server.", "#ffb08a", 2.4);
        return;
      }
      const payload = {
        v: Net.PROTOCOL_VERSION,
        type: Net.Msg.START_MATCH,
        roomCode: String(this.roomCode || "").trim().toUpperCase(),
        missionId: this.missionId | 0
      };
      this._dbgLog("host clicked start", payload);
      try {
        NetworkCoordinator.ws.send(JSON.stringify(payload));
        this._setHint("Waiting for server start...", "#8fdfff", 2.2);
      } catch (e) {
        this._dbgLog("start match send failed", { error: String(e && e.message ? e.message : e), payload });
        this._setHint("Failed to request match start.", "#ffb08a", 2.8);
      }
    },
    _onRoomJoinResult(msg) {
      this._dbgLog("room join result received", msg);
      if (!msg || msg.ok !== true) {
        const reason = String((msg && msg.error) || "Unable to join room.");
        this._setHint(reason, "#ffb08a", 3.4);
        return;
      }
      const roomCode = String(msg.roomCode || "").toUpperCase();
      const slotCount = clamp(msg.slotCount | 0, MULTI_MIN_SLOTS, MULTI_MAX_SLOTS);
      const connectedCount = clamp(msg.connectedCount | 0, 0, slotCount);
      const connectedSlots = new Array(slotCount).fill(false);
      if (Array.isArray(msg.connectedSlots)) {
        for (let i = 0; i < slotCount; i++) connectedSlots[i] = !!msg.connectedSlots[i];
      } else {
        for (let i = 0; i < connectedCount; i++) connectedSlots[i] = true;
      }
      this.localRoom = {
        roomCode,
        slotCount,
        connectedSlots,
        peerBySlot: new Array(slotCount).fill(null)
      };
      this.roomCode = roomCode;
      const wasSameRoom = !!(this.localRoom && String(this.localRoom.roomCode || "").toUpperCase() === roomCode);
      if (msg.slot != null && (!wasSameRoom || this.localPlayerId == null || this.localPlayerId < 0)) {
        this.localPlayerId = msg.slot | 0;
      }
      this.lobbyReady = connectedCount >= 2;
      if (this.phase !== "lobby") this.setPhase("lobby");
      if (msg.created) this._setHint("Room created: " + roomCode, "#8fdfff", 3.2);
      else this._setHint("Joined room " + roomCode, "#8fdfff", 3.2);
    },
    _onServerGameStart(msg) {
      this._dbgLog("client received gameStart event", msg);
      if (!msg || msg.ok === false) return;
      const code = String(msg.roomCode || "").toUpperCase();
      if (code && this.roomCode && code !== String(this.roomCode).toUpperCase()) return;
      const incomingMatchId = String(msg.matchId || "");
      if (incomingMatchId && this.currentMatchId && this.currentMatchId === incomingMatchId && this.phase === "playing") return;
      if (incomingMatchId) this.currentMatchId = incomingMatchId;
      if (msg.missionId != null) this.missionId = msg.missionId | 0;
      this.pendingStartMatchId = incomingMatchId || this.pendingStartMatchId || this.currentMatchId;
      if (this.phase === "playing" || this.phase === "intro_cutscene") return;
      this.setPhase("starting_match");
      this._setHint("Match starting... waiting for first snapshot.", "#8fdfff", 2.4);
    },
    _unlockClientAfterFirstSnapshot(matchId) {

    _requestCutsceneSkip(phaseName) {
      if (NetworkCoordinator.mode !== "ws_client") return false;

      else if (p === "post_level4_cutscene" && this.phase === p) this.finishPostLevel4Cutscene();

    _onServerCutsceneSkipped(msg) {

      const incomingMatchId = String(msg.matchId || "");

    _introClampIntroCam(cam, w) {
      const vw = VIEW_W / cam.scale;
      const vh = VIEW_H / cam.scale;
      const maxX = Math.max(0, w.worldW - vw);
      const maxY = Math.max(0, w.worldH - vh);
      cam.x = clamp(cam.x, 0, maxX);
      cam.y = clamp(cam.y, 0, maxY);
      return cam;
    },
    /** Intro ortho camera: center always a relay, guard group, spawn, or moving agent — never empty map space. */
    _introCutsceneComputeCam(scene, timer, dur, w, t) {
      const spawn = w.spawn || { x: 160, y: 850 };
      const ex = w.extraction || { x: 1460, y: 820, w: 180, h: 120 };
      const du = this.introCutsceneDeployU != null ? this.introCutsceneDeployU : 0;
      const termCentroid = () => {
        const ts = w.terminals || [];
        if (!ts.length) return { x: w.worldW * 0.48, y: w.worldH * 0.35 };
        let sx = 0, sy = 0;
        for (let i = 0; i < ts.length; i++) {
          const tm = ts[i];
          sx += tm.x + tm.w * 0.5;
          sy += tm.y + tm.h * 0.5;
        }
        return { x: sx / ts.length, y: sy / ts.length };
      };
      let cx = spawn.x;
      let cy = spawn.y;
      let scale = 0.46;
      if (scene === "city") {
        const tc = termCentroid();
        cx = tc.x + Math.sin(t * 0.42) * 20;
        cy = Math.max(100, tc.y - 130) + Math.cos(t * 0.36) * 14;
        scale = 0.31 + Math.sin(t * 0.22) * 0.015;
      } else if (scene === "cctv") {
        const gs = w.guards || [];
        if (gs.length) {
          let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
          for (let i = 0; i < gs.length; i++) {
            const g = gs[i];
            const gx = g._rx != null ? g._rx : g.x;
            const gy = g._ry != null ? g._ry : g.y;
            minx = Math.min(minx, gx);
            miny = Math.min(miny, gy);
            maxx = Math.max(maxx, gx);
            maxy = Math.max(maxy, gy);
          }
          const spread = Math.max(220, maxx - minx, maxy - miny);
          cx = (minx + maxx) * 0.5 + Math.sin(t * 0.72) * 18;
          cy = (miny + maxy) * 0.5 - 40 + Math.cos(t * 0.58) * 14;
          scale = clamp(VIEW_W / (spread * 1.28), 0.46, 0.74);
        } else {
          const tc = termCentroid();
          cx = tc.x + Math.sin(t * 0.5) * 12;
          cy = tc.y + Math.cos(t * 0.44) * 10;
          scale = 0.52;
        }
      } else if (scene === "nyx") {
        cx = spawn.x + 8 + Math.sin(t * 0.48) * 6;
        cy = spawn.y - 110 + Math.cos(t * 0.42) * 6;
        scale = 0.46 + Math.sin(t * 0.33) * 0.022;
      } else {
        const tx = ex.x + ex.w * 0.52;
        const ty = ex.y + ex.h * 0.42;
        const wx = spawn.x + (tx - spawn.x) * du;
        const wy = spawn.y + (ty - spawn.y) * du;
        cx = wx + Math.sin(t * 0.38) * 5;
        cy = wy - 75 + Math.cos(t * 0.32) * 5;
        scale = 0.48 + du * 0.16;
      }
      const viewW = VIEW_W / scale;
      const viewH = VIEW_H / scale;
      const cam = { x: cx - viewW * 0.5, y: cy - viewH * 0.5, scale };
      return this._introClampIntroCam(cam, w);
    },
    _introWorldToScreen(wx, wy, cam, sh) {
      return { x: sh.x + (wx - cam.x) * cam.scale, y: sh.y + (wy - cam.y) * cam.scale };
    },
    _drawIntroCutsceneGameWorld(ctx, scene, t, timer, dur) {
      const w = this.world;
      if (!w || !this._worldStaticCanvas) {
        ctx.fillStyle = "#03060c";
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.fillStyle = "#8ab";
        ctx.font = "14px monospace";
        ctx.textAlign = "center";
        ctx.fillText("Sector geometry unavailable.", VIEW_W / 2, VIEW_H / 2);
        ctx.textAlign = "left";
        return;
      }
      const cam = this._introCutsceneComputeCam(scene, timer, dur, w, t);
      const sh = VisualJuice.screenOffset();
      ctx.save();
      ctx.beginPath();
      ctx.rect(sh.x, sh.y, VIEW_W, VIEW_H);
      ctx.clip();
      ctx.translate(sh.x, sh.y);
      ctx.scale(cam.scale, cam.scale);
      ctx.translate(-cam.x, -cam.y);
      ctx.drawImage(this._worldStaticCanvas, 0, 0);
      const terms = w.terminals || [];
      for (let i = 0; i < terms.length; i++) {
        const tm = terms[i];
        ctx.fillStyle = "rgba(8,16,24,0.94)";
        ctx.fillRect(tm.x, tm.y, tm.w, tm.h);
        ctx.strokeStyle = "rgba(0,255,220,0.5)";
        ctx.lineWidth = 2 / Math.max(0.001, cam.scale);
        ctx.strokeRect(tm.x, tm.y, tm.w, tm.h);
        ctx.fillStyle = "rgba(0,255,200,0.22)";
        ctx.fillRect(tm.x + 4, tm.y + 6, tm.w - 8, 8);
      }
      if (w.extraction) {
        const ex = w.extraction;
        ctx.fillStyle = "rgba(0,255,220,0.1)";
        ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
        ctx.strokeStyle = "rgba(0,220,255,0.55)";
        ctx.lineWidth = 2 / Math.max(0.001, cam.scale);
        ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
        ctx.fillStyle = "#00ffcc";
        ctx.font = Math.round(12 / cam.scale) + "px monospace";
        ctx.fillText("EXTRACTION", ex.x + 8, ex.y + 20);
      }
      (w.guards || []).forEach(g => g.render(ctx));
      ctx.restore();
      if (scene === "city") {
        const gTop = ctx.createLinearGradient(0, sh.y, 0, sh.y + VIEW_H * 0.55);
        gTop.addColorStop(0, "rgba(0,0,0,0.05)");
        gTop.addColorStop(0.45, "rgba(0,0,0,0.38)");
        gTop.addColorStop(1, "rgba(0,0,0,0.82)");
        ctx.fillStyle = gTop;
        ctx.fillRect(sh.x, sh.y, VIEW_W, VIEW_H);
        for (let i = 0; i < terms.length; i++) {
          const tm = terms[i];
          const c = this._introWorldToScreen(tm.x + tm.w * 0.5, tm.y + tm.h * 0.5, cam, sh);
          const flick = 0.18 + 0.32 * (0.5 + 0.5 * Math.sin(t * 6.8 + i * 2.1));
          ctx.fillStyle = "rgba(0,255,220," + flick.toFixed(3) + ")";
          ctx.fillRect(c.x - 10, c.y - 10, 20, 20);
        }
        ctx.fillStyle = "rgba(200,255,255,0.42)";
        ctx.font = "11px monospace";
        ctx.textAlign = "left";
        ctx.fillText("ESTABLISHING — ARCOLOGY / GRID LIGHTS", sh.x + 18, sh.y + 28);
        ctx.textAlign = "left";
      }
      if (scene === "cctv") {
        const ft = (t * 44) | 0;
        for (let gy = 0; gy < VIEW_H; gy += 3) {
          const a = 0.012 + ((gy * 17 + ft * 3) % 5) * 0.006;
          ctx.fillStyle = "rgba(0,0,0," + a.toFixed(3) + ")";
          ctx.fillRect(sh.x, sh.y + gy, VIEW_W, 2);
        }
        const rec = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 6.2));
        ctx.fillStyle = "rgba(255,80,80," + rec.toFixed(3) + ")";
        ctx.font = "bold 13px monospace";
        ctx.textAlign = "left";
        ctx.fillText("● REC", sh.x + 20, sh.y + 36);
        ctx.fillStyle = "rgba(200,255,255,0.45)";
        ctx.font = "11px monospace";
        ctx.fillText("SECURITY FOOTAGE — PATROL IN MOTION", sh.x + 20, sh.y + 56);
        ctx.textAlign = "left";
      }
      if (scene === "nyx") {
        const spawn = w.spawn || { x: 160, y: 850 };
        const sc = this._introWorldToScreen(spawn.x, spawn.y - 8, cam, sh);
        const vg = ctx.createRadialGradient(sc.x, sc.y, 40, sc.x, sc.y, 220);
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(0.55, "rgba(0,0,0,0.55)");
        vg.addColorStop(1, "rgba(0,0,0,0.78)");
        ctx.fillStyle = vg;
        ctx.fillRect(sh.x, sh.y, VIEW_W, VIEW_H);
        const step = Math.sin(t * 2.8) * 3;
        this._drawCutsceneNyx(sc.x + step, sc.y, "idle", t);
        ctx.fillStyle = "rgba(200,255,255,0.4)";
        ctx.font = "11px monospace";
        ctx.textAlign = "left";
        ctx.fillText("AGENT NYX — HOLDING IN SHADOW", sh.x + 18, sh.y + VIEW_H - 52);
        ctx.textAlign = "left";
      }
      if (scene === "deploy") {
        const spawn = w.spawn || { x: 160, y: 850 };
        const ex = w.extraction || { x: 1460, y: 820, w: 180, h: 120 };
        const du = this.introCutsceneDeployU != null ? this.introCutsceneDeployU : 0;
        const wx = spawn.x + (ex.x + ex.w * 0.5 - spawn.x) * du;
        const wy = spawn.y + (ex.y + ex.h * 0.45 - spawn.y) * du;
        const sc = this._introWorldToScreen(wx, wy, cam, sh);
        this._drawCutsceneNyx(sc.x, sc.y, "walk", t);
        ctx.fillStyle = "rgba(200,255,255,0.42)";
        ctx.font = "11px monospace";
        ctx.textAlign = "left";
        ctx.fillText("MISSION START — MOVING TOWARD EXTRACTION LANE", sh.x + 18, sh.y + VIEW_H - 48);
        ctx.textAlign = "left";
      }
    },

    tryFakeTask() {
      if (this.phase !== "playing" || this.mode !== "play" || this.paused || !this.world || !this.player) return;
      if (!NetworkCoordinator.isAuthoritativeHost()) {
        NetworkCoordinator.sendMissionAction({ kind: "fake_task" }, this.localPlayerId);
        return;
      }
      const p = this.player, w = this.world, tlist = w.terminals || [];
      const maxD = this._interactionRadiusForPlayer(p);
      const maxD2 = maxD * maxD;
      let nearTerminal = false;
      for (let i = 0; i < tlist.length; i++) {
        const t = tlist[i];
        if (TerminalState.isCompleted(t)) continue;
        const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
        const dx = p.x - cx, dy = p.y - cy;
        if (dx * dx + dy * dy <= maxD2) { nearTerminal = true; break; }
      }
      let nearNpc = false;
      const npcs = w.npcs || [];
      for (let ni = 0; ni < npcs.length; ni++) {
        if (Math.hypot(p.x - npcs[ni].x, p.y - npcs[ni].y) < 158) { nearNpc = true; break; }
      }
      if (nearTerminal) {
        p.fakeTaskTimer = 5.2;
        SFX.play("ui_click");
        this._setHint("Feigning routine maintenance at console…", "#a8e8ff", 2.2);
      } else if (nearNpc) {
        p.fakeTaskTimer = 2.8;
        SFX.play("npc_talk");
        this._setHint("Blending in with nearby crew…", "#9fd7e8", 2.0);
      } else {
        SFX.play("interact_fail");
        this._setHint("Move closer to a terminal or NPC to feign work.", "#9bb0cc", 2.3);
      }
    },
    trySabotage() {
      if (this.phase !== "playing" || this.mode !== "play" || this.paused || !this.world || !this.player) return;
      if (!NetworkCoordinator.isAuthoritativeHost()) {
        NetworkCoordinator.sendMissionAction({ kind: "sabotage" }, this.localPlayerId);
        return;
      }
      const w = this.world, p = this.player, now = performance.now();
      const cd = p.role === "saboteur" ? 15000 : 17000;
      if ((w.flags.sabotageCooldown || 0) > now) {
        this._setHint("Sabotage kit recalibrating…", "#aabbcc", 1.5);
        SFX.play("interact_fail");
        return;
      }
      const hit = this._probeSabotageTarget();
      const R2 = 238 * 238;
      if (!hit || hit.d2 > R2) {
        SFX.play("interact_fail");
        this._setHint("No systems in range — move to a door, console, or light rig.", "#9bb0cc", 2.4);
        return;
      }
      w.flags.terminalSabotageLocks = w.flags.terminalSabotageLocks || {};
      const durM = p.role === "saboteur" ? 1.12 : 1;
      if (hit.kind === "terminal") {
        w.flags.terminalSabotageLocks[hit.terminal.id] = now + 6400 * durM;
        this._setHint("Console jammed — power cycling.", "#ffd38a", 2.1);
      } else if (hit.kind === "door") {
        const id = hit.doorId;
        if (w.flags.doorSabotageRevert && w.flags.doorSabotageRevert.id === id) {
          const prev = w.flags.doorSabotageRevert;
          w.doorsOpen[prev.id] = !!prev.restoreOpen;
          w.flags.doorSabotageRevert = null;
        }
        const wasOpen = !!w.doorsOpen[id];
        w.doorsOpen[id] = !wasOpen;
        w.flags.doorSabotageRevert = { id, restoreOpen: wasOpen, until: now + 5200 * durM };
        this.rebuildWalls();
        this._setHint(wasOpen ? "Door slammed — forced re-lock." : "Mag-strike — bulkhead briefly opened.", "#ffcc8a", 2.15);
      } else {
        w.flags.lumenSapUntil = now + 8200 * durM;
        this._setHint("Fixture tapped — local lights sapped.", "#cfe8ff", 2.05);
      }
      w.flags.sabotageCooldown = now + cd;
      w.alarm = clamp((w.alarm || 0) + (hit.kind === "door" ? 3.5 : 2.2), 0, 100);
      p.sabotageFxUntil = now + 620;
      NetworkManager.pushAlert("trace_noise", p.x, p.y);
      SFX.play("alarm_ping");
    },

    tryInvestigate() {
      if (this.phase !== "playing" || this.mode !== "play" || this.paused || !this.world || !this.player) return;
      if (!NetworkCoordinator.isAuthoritativeHost()) {
        NetworkCoordinator.sendMissionAction({ kind: "investigate" }, this.localPlayerId);
        return;
      }
      if (this.player.role !== "security_agent") return;
      const now = performance.now();
      if (this.player.investigateCd > now) return;
      const pls = AuthoritativeSession.players;
      let target = null, best = 260;
      for (let i = 0; i < pls.length; i++) {
        const o = pls[i];
        if (o === this.player) continue;
        const d = Math.hypot(o.x - this.player.x, o.y - this.player.y);
        if (d < best) { best = d; target = o; }
      }
      if (!target) return;
      target.suspicion = clamp(target.suspicion + 16, 0, 100);
      target.accusedFlash = 0.65;
      this.player.suspicion = Math.max(0, this.player.suspicion - 7);
      this.player.socialPulse = 0.55;
      this.player.investigateCd = now + 11500;
      NetworkManager.pushAlert("scan", this.player.x, this.player.y);
    },

      }
      if (!nearGuard) return;
      const pls = AuthoritativeSession.players;
      let target = null, best = 230;
      for (let i = 0; i < pls.length; i++) {
        const o = pls[i];
        if (o === this.player) continue;
        const d = Math.hypot(o.x - this.player.x, o.y - this.player.y);

      target.accusedFlash = 0.85;

    tryInteract() {
      if (this.phase !== "playing" || this.mode !== "play" || this.paused || !this.player || !this.world) return false;
      SFX.ensure();
      if (!NetworkCoordinator.isAuthoritativeHost()) {
        NetworkCoordinator.sendMissionAction({ kind: "interact" }, this.localPlayerId);
        return true;
      }
      const probe = this._nearestTerminalInRange();
      if (probe.terminal) {
        const t = probe.terminal;
        if (TerminalState.isCompleted(t)) {
          this._setHint("Node already completed.", "#8fdfff", 1.8);
          SFX.play("ui_click");
          return true;
        }
        const locks = this.world.flags.terminalSabotageLocks;
        if (locks && locks[t.id] > performance.now()) {
          this._setHint("Console locked — sabotage cycling power…", "#ffcc88", 2.0);
          SFX.play("interact_fail");
          return true;
        }
        if (probe.terminal.kind === "repair_panel") {
          this._beginRepairPanel(probe.terminal);
          return true;
        }
        if (probe.terminal.kind === "repair_task" || probe.terminal.kind === "circuit_task" || probe.terminal.kind === "timed_input_task") {
          this._startTaskForTerminal(probe.terminal);
          return true;
        }
        if (probe.terminal.kind === "access_card_pickup") {
          this.world.flags.accessCardFound = true;
          this.world.terminals = (this.world.terminals || []).filter(tt => tt.id !== probe.terminal.id);
          this._setHint("Access card acquired.", "#9effcf", 2.0);
          SFX.play("ui_click");
          return true;
        }
        if (probe.terminal.kind === "access_card_use") {
          if (!this.world.flags.accessCardFound) {
            this._setHint("Access card required.", "#ffb08a", 2.0);
            SFX.play("interact_fail");
            return true;
          }
          this.world.flags.accessCardFound = false;
          this.world.terminals = (this.world.terminals || []).filter(tt => tt.id !== probe.terminal.id);
          this._setHint("Access card accepted. Route unlocked.", "#9effcf", 2.2);
          SFX.play("hack_ok");
          return true;
        }
        SFX.play("hack_start");
        this.mode = "transition_in";
        this.transition = 0;
        this.pendingTerminal = probe.terminal;
        this._configureHackForPendingTerminal(false);
        return true;
      }
      const now = performance.now();
      if (now >= (this.interactRetryAt || 0)) {
        this.interactRetryAt = now + 180;
        this.interactFailMsgUntil = now + 1100;
        SFX.play("interact_fail");
        const hint = "Too far to interact. Move closer to a relay.";
        this.interactLastHint = hint;
        this._setHint(hint, "#8fdfff", 2.0);
      }
      return false;
    },
    requestInteract() {
      const now = performance.now();
      this.interactBufferedUntil = now + 140;
      if (this.tryInteract()) {
        this.interactBufferedUntil = 0;
      }
    },

    _configureHackForPendingTerminal(applyNow) {
      const w = this.world, t = this.pendingTerminal;
      if (!w || !t) return null;
      if (TerminalState.isCompleted(t)) return null;
      const shouldApply = applyNow !== false;
      const relays = (w.terminals || []).filter(tt => tt.kind === "primary");
      const relayIndex = Math.max(0, relays.findIndex(tt => tt.id === t.id));
      const solvedCount = Object.keys(w.hackedTerminals || {}).length;
      w._hackAttemptsByTerminal = w._hackAttemptsByTerminal || {};
      w._hackAttemptsByTerminal[t.id] = (w._hackAttemptsByTerminal[t.id] || 0) + 1;
      w._hackSignatures = w._hackSignatures || {};
      let tries = 0;
      let spec = null;
      while (tries < 7) {
        spec = HackEngine.buildRelaySpec({
          missionId: (w.def && w.def.id) != null ? (w.def.id | 0) : 1,
          missionSeed: ((w.def && w.def.rngSeed) || 0) >>> 0,
          sessionSeed: (((NetworkManager && NetworkManager.sessionSeed) || 0) ^ (w.worldW << 3) ^ (w.worldH << 7)) >>> 0,
          relayIndex,
          totalRelays: Math.max(1, relays.length),
          solvedCount,
          terminal: t,
          attempt: (w._hackAttemptsByTerminal[t.id] || 1) + tries
        });
        const dup = Object.keys(w._hackSignatures).some(k => k !== t.id && w._hackSignatures[k] === spec.signature);
        if (!dup) break;
        tries++;
      }
      if (spec && w.flags && w.flags.hackSpeedBonus > 0) {
        const factor = clamp(1 - w.flags.hackSpeedBonus, 0.72, 1);
        spec.stages = spec.stages.map(st => Object.assign({}, st, { durationSec: (st.durationSec || 7) * factor }));
      }
      if (spec && w.flags && performance.now() < (w.flags.npcHackSnappierUntil || 0)) {
        const sn = clamp(w.flags.npcHackSnappierMul || 0.93, 0.88, 0.98);
        spec.stages = spec.stages.map(st => Object.assign({}, st, { durationSec: (st.durationSec || 7) * sn }));
      }
      if (spec) {
        w._hackSignatures[t.id] = spec.signature;
        this._pendingHackSpec = spec;
        if (shouldApply) this.hack.configure(spec);
      }
      return spec;
    },

    update(dt) {
      if (this.phase !== "playing") return;
      if (this.paused) return;
      if (this.mode === "play" && this.interactBufferedUntil && performance.now() <= this.interactBufferedUntil) {
        if (this.tryInteract()) this.interactBufferedUntil = 0;
      } else if (this.interactBufferedUntil && performance.now() > this.interactBufferedUntil) {
        this.interactBufferedUntil = 0;
      }
      if (this.mode === "task") {
        if (!this.task || !this.task.active) {
          this.mode = "play";
          this.pendingTerminal = null;
          return;
        }
        this.task.update(dt, this);
        return;
      }
      if (this.mode === "transition_in") {
        if (!this.pendingTerminal || !this.world) {
          this.mode = "play";
          this.transition = 0;
          this.pendingTerminal = null;
          this._pendingHackSpec = null;
          return;
        }
        this.transition += dt;
        if (this.transition > 0.5) {
          const terminalId = this.pendingTerminal ? this.pendingTerminal.id : "";
          const terminalKind = this.pendingTerminal ? this.pendingTerminal.kind : "";
          this.previousState = STATES.CAMPAIGN;
          this.hackRunId++;
          this.mode = "hack";
          this.hackModeEnteredAt = performance.now();
          this.currentState = STATES.HACKING;
          if (this._pendingHackSpec) this.hack.configure(this._pendingHackSpec);
          else if (!this._configureHackForPendingTerminal(true)) {
            this.mode = "play";
            this.transition = 0;
            this.pendingTerminal = null;
            this._pendingHackSpec = null;
            return;
          }
          this._pendingHackSpec = null;
          if (this.pendingTerminal) TerminalState.set(this.pendingTerminal, TerminalState.IN_PROGRESS);
          InputManager.enterHackingMode();
          this._dbgWatchStart("hack-session-active", 2500, { terminalId });
          this.emitEvent("onHackStart", {
            runId: this.hackRunId,
            terminalId,
            terminalKind
          }, "hack-start:" + String(this.hackRunId));
          this.hackingSession.begin(() => this.onHackDone(), () => this.onHackFail(), () => this.onHackMistake());
        }
        return;
      }
      if (this.mode === "hack") {
        if (!this.hackingSession || !this.hackingSession.hacking || !this.hack.active) {
          const ht = this.pendingTerminal;
          if (ht && ht.state === TerminalState.IN_PROGRESS) TerminalState.set(ht, TerminalState.INACTIVE);
          // Never allow dead-end hack mode: force transition back to gameplay.
          this.mode = "play";
          this.currentState = STATES.CAMPAIGN;
          this.queueState(STATES.CAMPAIGN);
          this.syncStateFromPhase();
          return;
        }
        this.hack.update(dt);
        return;
      }

      if (!NetworkCoordinator.isAuthoritativeHost()) {
        this._remoteClientFrame(dt);
        this._updateNpcTask(dt);
        this._updateNpcFavor(dt);
        this._updateRepair(dt);
        return;
      }
      SimulationRunner.runMissionTick(dt, this);
      this._updateNpcTask(dt);
      this._updateNpcFavor(dt);
      this._updateRepair(dt);
    },

    /** WebSocket client: no local physics; server sends SNAPSHOT; we only send INPUT + camera. */
    _remoteClientFrame(dt) {
      const w = this.world;
      this.player = this._resolveLocalPlayer(AuthoritativeSession.players);
      const p = this.player;
      if (!w || !p) return;
      NetworkCoordinator.sendInputFrame({ slot: this.localPlayerId, keys: this.keys });
      // Interpolate remote players toward latest server targets for smooth, low-latency visuals.
      const now = performance.now();
      for (let i = 0; i < AuthoritativeSession.players.length; i++) {
        const rp = AuthoritativeSession.players[i];
        if (!rp || (rp.id | 0) === (this.localPlayerId | 0)) continue;
        if (rp._netTargetX == null || rp._netTargetY == null) continue;
        const ageSec = clamp((now - (rp._netSnapAt || now)) * 0.001, 0, 0.18);
        const tx = rp._netTargetX + (rp._netTargetVx || 0) * ageSec;
        const ty = rp._netTargetY + (rp._netTargetVy || 0) * ageSec;
        const dx = tx - rp.x, dy = ty - rp.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > 220 * 220) {
          rp.x = tx;
          rp.y = ty;
        } else {
          const k = 1 - Math.exp(-13 * dt);
          rp.x = lerp(rp.x, tx, k);
          rp.y = lerp(rp.y, ty, k);
        }
      }
      this._smoothCameraToward(p, w, dt);
      this.shake *= 0.9;
      // Client never mutates core mission state; server snapshots are authoritative.
      if (MissionSystem.isComplete(w)) this.triggerWin();
    },

    onHackMistake(reason) {
      if (!this.world || !this.player) return;
      const w = this.world;
      w.alarm = clamp(w.alarm + 6.5, 0, 100);
      w.exposure = clamp((w.exposure || 0) + 4.25, 0, 100);
      if (reason === "decoy") {
        // Decoy clicks are a high-risk mistake: stronger trace spike + brief lock.
        w.alarm = clamp(w.alarm + 4.5, 0, 100);
        w.exposure = clamp((w.exposure || 0) + 3.25, 0, 100);
        this.hack.canInteract = false;
        setTimeout(() => {
          if (this.phase === "playing" && this.mode === "hack") this.hack.canInteract = true;
        }, 520);
      }
      NetworkManager.pushAlert("trace_noise", this.player.x, this.player.y);
    },
    onHackFail() {
      const t = this.pendingTerminal;
      SFX.play("hack_fail");
      this.emitEvent("onHackComplete", {
        runId: this.hackRunId,
        success: false,
        terminalId: t ? t.id : "",
        terminalKind: t ? t.kind : ""
      }, "hack-complete:" + String(this.hackRunId));
    },
    onHackDone() {
      const t = this.pendingTerminal;
      SFX.play("hack_ok");
      this.emitEvent("onHackComplete", {
        runId: this.hackRunId,
        success: true,
        terminalId: t ? t.id : "",
        terminalKind: t ? t.kind : ""
      }, "hack-complete:" + String(this.hackRunId));
    },
    ensurePostHackStateHealth(now) {
      if (this.phase !== "playing") return;
      if (this.mode === "hack") return;
      if (!this.hackExitRequestedAt) return;
      if (now - this.hackExitRequestedAt < 1800) return;
      this.hackExitRequestedAt = 0;
      if (this.currentState !== STATES.CAMPAIGN) {
        this.queueState(STATES.CAMPAIGN);
        this.syncStateFromPhase();
        this._dbgLog("post-hack state recovery", { phase: this.phase, mode: this.mode, currentState: this.currentState });
      }
    },

    triggerWin() {
      if (this.phase !== "playing") return;
      SFX.play("mission_win");
      this.completeMission();
    },
    triggerFail() {
      if (this.phase !== "playing") return;
      SFX.play("mission_fail");
      this.setPhase("mission_fail");
    },

    render(dt) {
      const frameDt = dt != null ? dt : 0.016;
      VisualJuice.updatePresentation(frameDt, this);
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.fillStyle="#030508"; ctx.fillRect(0,0,VIEW_W,VIEW_H);
      switch (this.currentState) {
        case STATES.MENU:
          if (this.phase==="terminal_login") { this.drawTerminalLogin(); ctx.restore(); return; }
          if (this.phase==="multiplayer_menu") { this.drawMultiplayerMenu(); ctx.restore(); return; }
          if (this.phase==="title") { this.drawTitle(); ctx.restore(); return; }
          if (this.phase==="mission_select") { this.drawMissionSelect(); ctx.restore(); return; }
          if (this.phase==="briefing") { this.drawBriefing(); ctx.restore(); return; }
          if (this.phase==="intro_cutscene") { this.drawIntroCutscene(); ctx.restore(); return; }
          break;
        case STATES.MULTIPLAYER_LOBBY:
          this.drawLobby();
          ctx.restore();
          return;
        case STATES.GAMEOVER:
          if (this.phase==="mission_win") this.drawWin();
          else if (this.phase==="loading_next") this.drawLoadingNext();
          else if (this.phase==="post_level1_cutscene") this.drawPostLevel1Cutscene();
          else if (this.phase==="post_level2_cutscene") this.drawPostLevel2Cutscene();
          else if (this.phase==="post_level3_cutscene") this.drawPostLevel3Cutscene();
          else if (this.phase==="post_level4_cutscene") this.drawPostLevel4Cutscene();
          else if (this.phase==="post_level5_cutscene") this.drawPostLevel5Cutscene();
          else if (this.phase==="final_cutscene") this.drawFinalCutscene();
          else this.drawFail();
          ctx.restore();
          return;
        case STATES.CAMPAIGN:
        case STATES.HACKING:
          break;
        default:
          break;
      }

      const w = this.world;
      if (!w) { ctx.restore(); return; }
      const sh = VisualJuice.screenOffset();
      ctx.translate(sh.x, sh.y);
      ctx.translate(-this.cam.x, -this.cam.y);
      if (!this._worldStaticCanvas) this._buildStaticWorldLayer();
      if (this._worldStaticCanvas) ctx.drawImage(this._worldStaticCanvas, 0, 0);
      else ctx.fillRect(0, 0, w.worldW, w.worldH);
      w.cameras.forEach(c => c.render(ctx));
      const talkProbe = this._nearestTalkNpc();
      (w.npcs || []).forEach(n => {
        n.render(ctx);
        if (talkProbe && talkProbe.npc === n && this.mode === "play") {
          ctx.fillStyle = "rgba(200,255,245,0.95)";
          ctx.font = "10px monospace";
          ctx.textAlign = "center";
          ctx.fillText("Q TALK", n.x, n.y - 26);
          ctx.textAlign = "left";
        }
      });
      w.guards.forEach(g => g.render(ctx));
      if (w.extraction) {
        const ex = w.extraction;
        const exObj = (w.objectives || []).find(o => o.type === "extraction");
        const ready = exObj && exObj.done;
        ctx.fillStyle = ready ? "rgba(0,255,200,0.16)" : "rgba(0,255,220,0.08)";
        ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
        ctx.strokeStyle = ready ? "rgba(0,255,255,0.75)" : "rgba(0,200,255,0.45)";
        ctx.lineWidth = 2;
        ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
        ctx.fillStyle = "#00ffcc";
        ctx.font = "12px monospace";
        ctx.fillText(ready ? "EXTRACTION — STAND BY" : "EXTRACTION", ex.x + 8, ex.y + 22);
      }
      const p = this.player;
      const maxD = this._interactionRadiusForPlayer(p);
      const maxD2 = maxD * maxD;
      w.terminals.forEach(t => {
        TerminalState.ensure(t);
        const done = TerminalState.isCompleted(t);
        const inProg = TerminalState.isInProgress(t);
        const tx = t.x + t.w * 0.5, ty = t.y + t.h * 0.5;
        const dx = p ? (p.x - tx) : 0;
        const dy = p ? (p.y - ty) : 0;
        const inRange = !!(p && this.mode === "play" && (dx * dx + dy * dy) <= maxD2);
        const gc = done ? "#5cff9c" : inProg ? "#ffcc66" : (inRange ? "#6dffef" : "#00ffcc");
        Renderer.withGlow(ctx, gc, done ? 8 : (inProg ? 12 : 18), () => {
          ctx.fillStyle = done ? "rgba(8,22,14,0.92)" : inProg ? "rgba(28,22,8,0.9)" : "#0e1218";
          ctx.fillRect(t.x, t.y, t.w, t.h);
        });
        ctx.strokeStyle = done ? "rgba(92,255,156,0.98)" : inProg ? "rgba(255,200,100,0.95)" : (inRange ? "rgba(130,255,240,0.98)" : "rgba(0,255,220,0.65)");
        ctx.lineWidth = done ? 2.8 : inProg ? 2.4 : (inRange ? 2.6 : 1.5);
        ctx.shadowColor = gc;
        ctx.shadowBlur = done ? 10 : inProg ? 14 : (inRange ? 20 : 12);
        ctx.strokeRect(t.x,t.y,t.w,t.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = done ? "#b7ffd5" : inProg ? "#ffe8c0" : "#cceeff";
        ctx.font="10px monospace";
        ctx.fillText(t.label, t.x+6, t.y+16);
        if (inRange && !done && !inProg) {
          ctx.fillStyle = "rgba(180,255,244,0.95)";
          ctx.font = "9px monospace";
          const lab = t.kind === "repair_panel" ? "HOLD [E] REPAIR" : "IN RANGE [E]";
          ctx.fillText(lab, t.x + 6, t.y + t.h - 6);
        }
        if (inProg && !done) {
          ctx.fillStyle = "rgba(255,220,160,0.95)";
          ctx.font = "bold 8px monospace";
          ctx.fillText("ACTIVE", t.x + 6, t.y + t.h - 6);
        }
        if (done) {
          const badgeW = 42, badgeH = 12;
          ctx.fillStyle = "rgba(20,60,40,0.95)";
          ctx.fillRect(t.x + t.w - badgeW - 4, t.y + 4, badgeW, badgeH);
          ctx.strokeStyle = "rgba(120,255,190,0.75)";
          ctx.strokeRect(t.x + t.w - badgeW - 4, t.y + 4, badgeW, badgeH);
          ctx.fillStyle = "#caffde";
          ctx.font = "bold 8px monospace";
          ctx.fillText("DONE ✓", t.x + t.w - badgeW + 2, t.y + 13);
          ctx.fillStyle = "rgba(170,255,210,0.95)";
          ctx.font = "bold 9px monospace";
          ctx.fillText("COMPLETED", t.x + 6, t.y + t.h - 6);
        }
      });
      (w.objectives || []).forEach(o => {
        const drawRetrieve = (rect, doneHint) => {
          if (!rect) return;
          ctx.strokeStyle = w.flags.package ? "rgba(0,255,160,0.45)" : "rgba(0,220,255,0.55)";
          ctx.setLineDash(doneHint ? [] : [8, 5]);
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(0,255,220,0.07)";
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
          ctx.fillStyle = "#8fd";
          ctx.font = "11px monospace";
          ctx.fillText("DATA CRATE", rect.x + 6, rect.y + 18);
        };
        if (o.type === "retrieve" && o.rect) {
          drawRetrieve(o.rect, o.done);
          if (o.done) {
            ctx.strokeStyle = "rgba(120,255,170,0.75)";
            ctx.strokeRect(o.rect.x, o.rect.y, o.rect.w, o.rect.h);
            ctx.fillStyle = "#bfffd8";
            ctx.font = "bold 10px monospace";
            ctx.fillText("DONE ✓", o.rect.x + 6, o.rect.y + o.rect.h - 8);
          }
        }
        if (o.type === "compound" && o.steps) {
          for (let si = 0; si < o.steps.length; si++) {
            const st = o.steps[si];
            if (st.kind === "retrieve" && st.rect) drawRetrieve(st.rect, o.done);
          }
        }
        if (o.type === "visit" && o.rect && !o.done) {
          ctx.strokeStyle = "rgba(255,200,100,0.55)";
          ctx.setLineDash([7, 5]);
          ctx.strokeRect(o.rect.x, o.rect.y, o.rect.w, o.rect.h);
          ctx.setLineDash([]);
          ctx.fillStyle = "#fc8";
          ctx.font = "11px monospace";
          ctx.fillText("INFIL", o.rect.x + 6, o.rect.y + 18);
        } else if (o.type === "visit" && o.rect && o.done) {
          ctx.strokeStyle = "rgba(120,255,170,0.8)";
          ctx.strokeRect(o.rect.x, o.rect.y, o.rect.w, o.rect.h);
          ctx.fillStyle = "rgba(120,255,170,0.10)";
          ctx.fillRect(o.rect.x, o.rect.y, o.rect.w, o.rect.h);
          ctx.fillStyle = "#bfffd8";
          ctx.font = "bold 10px monospace";
          ctx.fillText("DONE ✓", o.rect.x + 6, o.rect.y + 18);
        }
      });
      const slotOn = NetworkCoordinator.connectedSlots;
      AuthoritativeSession.players.forEach(pl => {
        if (slotOn && slotOn.length > pl.id && slotOn[pl.id] === false) return;
        pl.render(ctx);
      });
      ctx.restore();

      this.drawHUD();
      if (this.mode==="transition_in") {
        const te = easeOutCubic(Math.min(1, this.transition / 0.5));
        ctx.fillStyle = "rgba(0,0,0," + (te * 0.88) + ")";
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.strokeStyle = "rgba(0,255,220," + (te * 0.35) + ")";
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, VIEW_W - 4, VIEW_H - 4);
      }
      this.hack.render(ctx);
      if (this.task && this.task.active) this.task.render(ctx);
      if (this.paused) {
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0,0,VIEW_W,VIEW_H);
        ctx.fillStyle = "#0ff";
        ctx.font = "bold 22px monospace";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", VIEW_W/2, VIEW_H/2 - 8);
        ctx.fillStyle = "#89a";
        ctx.font = "13px monospace";
        ctx.fillText("Escape to resume", VIEW_W/2, VIEW_H/2 + 22);
        ctx.restore();
      }
      if (this.phase === "playing") {
        const w = this.world;
        if (w && w.flags.blackoutUntil && performance.now() < w.flags.blackoutUntil) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = "rgba(0,0,0,0.78)";
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
          ctx.fillStyle = "rgba(0,255,200,0.12)";
          ctx.font = "12px monospace";
          ctx.fillText("BLACKOUT — optics blind", 24, VIEW_H - 24);
          ctx.restore();
        }
        this.drawTopObjectiveBar();
        this.drawEventBanner();
        this.drawActionToast();
        this.drawPostFX();
      }
    },
    drawTopObjectiveBar() {
      const w = this.world;
      if (!w || this.phase !== "playing") return;
      const cur = this._currentObjectiveSummary(w);
      const relaysDone = (w.primaryProgress || 0);
      const relaysNeed = (w.primaryRequired || 1);
      const objectives = w.objectives || [];
      const completed = objectives.filter(o => !!o.done).length;
      const total = Math.max(1, objectives.length);
      const progress = clamp(completed / total, 0, 1);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const boxW = Math.min(620, VIEW_W - 120);
      const boxX = (VIEW_W - boxW) / 2;
      const boxY = 10;
      const boxH = 62;
      ctx.fillStyle = "rgba(6,16,24,0.78)";
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = "rgba(120,220,255,0.38)";
      ctx.strokeRect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = "#8fd";
      ctx.font = "bold 10px monospace";
      ctx.textAlign = "left";
      ctx.fillText("CURRENT OBJECTIVE", boxX + 12, boxY + 15);
      ctx.fillStyle = "#dff8ff";
      ctx.font = "12px monospace";
      ctx.fillText(cur, boxX + 12, boxY + 33);
      ctx.fillStyle = "#9fd7e8";
      ctx.font = "10px monospace";
      ctx.textAlign = "right";
      ctx.fillText("Relays Completed: " + relaysDone + " / " + relaysNeed, boxX + boxW - 12, boxY + 33);
      ctx.fillStyle = "#9fd7e8";
      ctx.fillText("Objectives: " + completed + " / " + total, boxX + boxW - 12, boxY + 48);
      const barX = boxX + 12, barY = boxY + 51, barW = Math.max(120, boxW - 250), barH = 6;
      ctx.fillStyle = "rgba(0,0,0,0.38)";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = "rgba(120,255,220,0.65)";
      ctx.fillRect(barX + 1, barY + 1, (barW - 2) * progress, barH - 2);
      ctx.strokeStyle = "rgba(120,220,255,0.35)";
      ctx.strokeRect(barX, barY, barW, barH);
      ctx.restore();
    },

    drawEventBanner() {
      if (!this.eventBannerText) return;
      const now = performance.now();
      if (now >= this.eventBannerUntil) {
        this.eventBannerText = "";
        this.eventBannerUntil = 0;
        this.eventBannerStartAt = 0;
        return;
      }
      const life = Math.max(0.001, this.eventBannerUntil - (this.eventBannerStartAt || now));
      const t = clamp((now - (this.eventBannerStartAt || now)) / life, 0, 1);
      const fadeIn = clamp(t * 3.2, 0, 1);
      const fadeOut = clamp((1 - t) * 1.4, 0, 1);
      const alpha = Math.min(fadeIn, fadeOut);
      const y = 94 + Math.sin(now * 0.01) * 1.8;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = alpha * 0.92;
      ctx.fillStyle = "rgba(12,8,10,0.72)";
      ctx.fillRect(0, 52, VIEW_W, 64);
      ctx.strokeStyle = "rgba(255,110,80,0.75)";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 52, VIEW_W, 64);
      if (Math.random() < 0.3) {
        ctx.fillStyle = "rgba(255,120,90,0.14)";
        ctx.fillRect(0, 52 + Math.random() * 60, VIEW_W, 2 + Math.random() * 3);
      }
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 26px monospace";
      ctx.shadowColor = this.eventBannerColor || "#ff8844";
      ctx.shadowBlur = 18;
      ctx.fillStyle = this.eventBannerColor || "#ff8844";
      ctx.fillText(this.eventBannerText, VIEW_W / 2, y);
      ctx.shadowBlur = 0;
      ctx.restore();
    },
    drawActionToast() {
      if (!this.uiToastText) return;
      const now = performance.now();
      if (now >= this.uiToastUntil) {
        this.uiToastText = "";
        this.uiToastUntil = 0;
        this.uiToastStartAt = 0;
        return;
      }
      const life = Math.max(0.001, this.uiToastUntil - (this.uiToastStartAt || now));
      const t = clamp((now - (this.uiToastStartAt || now)) / life, 0, 1);
      const alpha = Math.min(clamp(t * 4, 0, 1), clamp((1 - t) * 1.35, 0, 1));
      const y = VIEW_H - 102 + (1 - alpha) * 10;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = alpha * 0.95;
      ctx.fillStyle = "rgba(4,14,22,0.86)";
      ctx.fillRect(VIEW_W - 410, y, 392, 34);
      ctx.strokeStyle = "rgba(120,220,255,0.45)";
      ctx.strokeRect(VIEW_W - 410, y, 392, 34);
      ctx.fillStyle = this.uiToastColor || "#9fe8ff";

              ctx.fillText(choiceBlocks[i].lines[li], textX, ly2);
              ly2 += 12;
            }
            yText += h + 4;
          }
        }

      ctx.restore();
